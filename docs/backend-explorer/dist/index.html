 /* ---------------------------------------------------------------------------
   The app shell, shared by every instrument on this box.
   A stage that pans and zooms, a floating text layer over it, and chrome that
   answers "where am I / what is selected / what is the tool doing".
   Every value here names a role from the token layer; none is a literal.
   --------------------------------------------------------------------------- */
:root{
  /* The text layer scales independently of the stage. The stage has its own
     camera; browser zoom would rescale both at once, and ctrl+wheel is already
     claimed as pinch-zoom. So chrome and panels carry their own scale. */
  --ui-scale: 1;

  /* A focus ring that belongs to this product: detached from the element by a
     ground-coloured gap, following whatever radius the element already has, and
     haloed so it reads on a busy stage. Never the UA's square black box. */
  --focus-ring:
    0 0 0 2px var(--md-sys-color-surface),
    0 0 0 4px var(--md-sys-color-primary),
    0 0 0 8px color-mix(in srgb, var(--md-sys-color-primary) 22%, transparent);
  --focus-ring-inset: inset 0 0 0 2px var(--md-sys-color-primary);
  /* box-shadow does not paint on SVG geometry, so scene objects take the same
     halo through a drop-shadow filter instead */
  --focus-glow: drop-shadow(0 0 5px color-mix(in srgb, var(--md-sys-color-primary) 60%, transparent));
  --app-bg:     var(--md-sys-color-surface);
  --bar-bg:     var(--md-sys-color-surface-container);
  --panel-bg:   var(--md-sys-color-surface-container-high);
  --panel-line: var(--md-sys-color-outline-variant);
  --text:       var(--md-sys-color-on-surface);
  --text-muted: var(--md-sys-color-on-surface-variant);
  --grid-line:  color-mix(in srgb, var(--md-sys-color-outline) 16%, transparent);
}
.context-controls{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;

.context-label{color:var(--text-muted);margin-right:4px}
.context-controls .btn{white-space:normal;max-width:100%;font-size:inherit;line-height:1.4;

*{box-sizing:border-box}
/* The stage and the bars are surfaces you manipulate, not text you read: a
   double-click there would otherwise select a label, and dragging would extend
   that selection across the scene. */
svg.stage,.titlebar,.status,.tools{-webkit-user-select:none;user-select:none}
/* A floating panel is the opposite of the stage: it is the reading surface.
   Everything in it — a command, an address, the name of a thing, a row in the
   index — is text a reader may want to copy, so all of it selects, in every
   panel, at every depth, whatever the app called the panel. The view palette
   is chrome and keeps its hands off. */
.hud{-webkit-user-select:text;user-select:text}
.hud.tools{-webkit-user-select:none;user-select:none}
/* Scale the text, not the panel boxes. Zooming a floating panel scales its box
   but not its offsets, so it grows past its own edges and starts covering the
   stage; scaling only the content leaves every panel's geometry — and therefore
   Fit — untouched, and larger text simply means more scrolling.
   The bars are in normal flow, so they can scale whole. */
.titlebar,.status{zoom:var(--ui-scale)}
.hud header,.hud .scroll{zoom:var(--ui-scale)}
/* The view palette has no scroll region; it scales whole, with its offsets
   divided back out so it stays put in its corner. */
.tools{zoom:var(--ui-scale);
  bottom:calc(14px / var(--ui-scale));left:calc(14px / var(--ui-scale))}
/* Labels in the scene carry real values — addresses, ports, run ids — so text
   itself stays selectable, and says so with a text cursor. The pan handler
   stands aside when a drag starts on one. */
svg.stage text{-webkit-user-select:text;user-select:text;cursor:text}
/* Clicking a focusable scene object focuses it without being :focus-visible, and
   the UA then paints its own near-black 5px outline. Ours is the only ring the
   product should ever show, so the default is suppressed for that case. */
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:none;box-shadow:var(--focus-ring);
  transition:box-shadow var(--dur-short) var(--ease-standard)}
/* a clipping parent would cut an outer ring, so those get an inner one */
.seg .btn:focus-visible{box-shadow:var(--focus-ring-inset)}
/* browsers make overflowing regions keyboard-focusable; give them a radius to
   hang the ring on rather than a hard rectangle */
.scroll:focus-visible,.tree:focus-visible{border-radius:var(--shape-md)}

/* Scrollbars are chrome too. Two engines, two mechanisms: Chromium and Firefox

/* `hidden` means hidden. A class that sets `display` on the same element wins
   over the attribute otherwise, and the thing stays on screen while every
   script that checks `.hidden` believes it is gone. */
[hidden]{display:none !important}
.hud{position:absolute;z-index:3;border:1px solid var(--panel-line);
  border-radius:var(--shape-lg);box-shadow:var(--elev-2);
  background:color-mix(in srgb, var(--panel-bg) 90%, transparent);

/* Reading and navigation need a deliberate measure, even when an author gives

/* --- layout that does not move when a value changes ------------------------
   Two things make an interface look like it is glitching while you drag a
   control: a readout that grows and squeezes its label onto a second line, and
   a scrollbar that appears and reflows the text beside it. Both are layout
   thrash, and both are prevented here rather than per app. */
.val,.clock{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;flex:none}
.row label{white-space:nowrap;flex:none}
/* A control row holds a label that must not wrap and a readout with a reserved
   width, so at a larger text size something has to give: the slider shrinks
   first, and the row wraps only when it has to. Prose just re-wraps and
   scrolls; a control row cannot. */
.row{flex-wrap:wrap}
input[type=range]{min-width:40px;flex:0 1 auto}
.status,.tick,.status .cell{font-variant-numeric:tabular-nums}
/* A readout reserves the width of its longest value, so the cells beside it do
   not shuffle as it changes — and no more than that, or the cell reads as
   badly padded on one side.
   Width only: as a status cell these are flex items that centre their own
   contents, and an id rule setting `display` here quietly beat that — the
   readout then sat against the top edge of a 30px bar. */
#st-zoom{min-width:9ch}
#st-sel{min-width:20ch}
:where(#st-zoom,#st-sel):not(.cell){display:inline-block}
/* Reserve the scrollbar's column at all times: appearing on demand shifts the
   content beside it, which reads as a flicker. */
.scroll,.tree{scrollbar-gutter:stable}

/* --- the text layer as a surface, not only a sidebar --------------------- */

  opacity:0;pointer-events:none;transition:opacity var(--dur-med) var(--ease-standard)}

.hud.modal{z-index:6;top:3vh;bottom:3vh;left:50%;right:auto;

   width changes, and the stage re-fits into what is left. */
/* Bounded by the room, not only by a maximum: at 72vw a widened panel left a

<div class="status"><span class="cell" id="st-zoom"></span><span class="cell" id="st-sel">nothing selected</span><span class="cell" id="st-hint">Select a class to read it. Double-click (or Enter) opens its endpoints, methods or fields.</span></div>
<script>
/* ---------------------------------------------------------------------------
   Motion, shared by every app.

   One rule decides whether a change is animated: if the person is dragging,
   pinching or scrolling, the view must follow the input exactly — easing there
   reads as lag. Everything the system moves on their behalf (fit, frame, zoom
   buttons, switching scene, opening a section) eases instead.
   --------------------------------------------------------------------------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* While a control is being dragged it emits a value on every frame. Playing the
   committed-change motion for each one stacks fades that never finish and starts
   a camera flight that cancels the one before it — which reads as a glitch until
   the drag ends. Mute motion for the live part, restore it on commit. */
let motionMuted = false;
const muteMotion = on => { motionMuted = !!on; };
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const DECEL = 'cubic-bezier(.05,.7,.1,1)';   /* M3 emphasized-decelerate */

/* Van Wijk & Nuij, "Smooth and efficient zooming and panning" (2003).
   Travelling a long way, the camera pulls back, crosses, and settles — the path
   a hand would take. A straight lerp of the viewBox instead slides at a speed
   that looks wrong at both ends. Returns an interpolator plus its own natural
   duration, since the algorithm knows how far the journey really is. */
function interpolateZoom(p0, p1){
  const rho = Math.SQRT2, rho2 = 2, rho4 = 4;
  const [ux0, uy0, w0] = p0, [ux1, uy1, w1] = p1;
  const dx = ux1 - ux0, dy = uy1 - uy0, d2 = dx * dx + dy * dy;
  // "Same place" must be judged relative to the viewport, not by an absolute
  // epsilon: in world units of thousands, a gap of 1e-5 is a pure zoom, but the
  // general branch divides by it and yields NaN. Reached by pressing zoom-out
  // while a zoom-in flight is still running — both aim at the same centre.
  const eps = Math.max(1e-12, w0 * w0 * 1e-6);
  let i, S;
  if (d2 < eps) {                       // same place: a pure zoom
    S = Math.log(w1 / w0) / rho;
    i = t => [ux0 + t * dx, uy0 + t * dy, w0 * Math.exp(rho * t * S)];
  } else {
    const d1 = Math.sqrt(d2);
    const b0 = (w1 * w1 - w0 * w0 + rho4 * d2) / (2 * w0 * rho2 * d1);
    const b1 = (w1 * w1 - w0 * w0 - rho4 * d2) / (2 * w1 * rho2 * d1);
    const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0);
    const r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
    S = (r1 - r0) / rho;
    i = t => {
      const s = t * S, coshr0 = Math.cosh(r0);
      const u = w0 / (rho2 * d1) * (coshr0 * Math.tanh(rho * s + r0) - Math.sinh(r0));
      return [ux0 + u * dx, uy0 + u * dy, w0 * coshr0 / Math.cosh(rho * s + r0)];
    };
  }
  i.duration = Math.abs(S) * 1000;
  return i;
}

let flyToken = 0;
const cancelFly = () => { flyToken++; };

/* Fly the camera to a target view. Interruptible: a new flight, or any direct
   manipulation, abandons the old one from wherever it had got to. */
function flyView(svg, getView, setView, target){
  cancelFly();
  const mine = flyToken, cur = getView();
  const near = (a, b, tol) => Math.abs(a - b) < tol;
  if (REDUCED || motionMuted || (near(cur.x, target.x, 0.6) && near(cur.y, target.y, 0.6) &&
                  near(cur.w, target.w, 0.6))) { setView(target); return; }
  const r = svg.getBoundingClientRect();
  const aspect = (r.height && r.width) ? r.height / r.width : cur.h / cur.w;
  const iz = interpolateZoom(
    [cur.x + cur.w / 2, cur.y + cur.h / 2, cur.w],
    [target.x + target.w / 2, target.y + target.h / 2, target.w]);
  if (!Number.isFinite(iz.duration)) { setView(target); return; }   // never fly to NaN
  const ms = Math.max(280, Math.min(900, iz.duration));
  const t0 = performance.now();
  const step = now => {
    if (mine !== flyToken) return;                    // superseded
    const t = Math.min(1, (now - t0) / ms);
    const [cx, cy, w] = iz(easeInOutCubic(t));
    if (!Number.isFinite(cx) || !Number.isFinite(cy) || !Number.isFinite(w) || w <= 0) {
      setView(target); return;                    // bail straight to the destination
    }
    const h = w * aspect;
    setView({x: cx - w / 2, y: cy - h / 2, w, h});
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* Replace panel content without it snapping into place. */
function swapIn(el, html){
  el.innerHTML = html;
  if (REDUCED || motionMuted) return;
  el.animate([{opacity:0, transform:'translateY(7px)'}, {opacity:1, transform:'none'}],
             {duration:260, easing:DECEL});
}

/* One orchestrated entrance, not a permanent hover-and-float habit. */
function revealAll(nodes, step){
  if (REDUCED || motionMuted) return;
  const s = step || 26;
  nodes.forEach((n, i) => n.animate(
    [{opacity:0, transform:'translateY(10px)'}, {opacity:1, transform:'none'}],
    {duration:460, delay:Math.min(i * s, 420), easing:DECEL, fill:'backwards'}));
}

/* A redraw that replaces everything on the stage should cross-fade, not blink. */
function fadeIn(node, ms){
  if (REDUCED || motionMuted) return;
  node.animate([{opacity:0}, {opacity:1}], {duration:ms || 220, easing:DECEL});
}

/* Hiding a layer is a state change, not a cut: fade it out, then take it out of
   layout so it stops affecting Fit. */
function setHidden(node, hidden){
  if (REDUCED) { node.classList.toggle('off', hidden); return; }
  if (hidden) {
    const a = node.animate([{opacity:1}, {opacity:0}], {duration:180, easing:DECEL});
    a.onfinish = () => node.classList.add('off');
  } else {
    node.classList.remove('off');
    node.animate([{opacity:0}, {opacity:1}], {duration:220, easing:DECEL});
  }
}

/* A selection made in a panel can still be extended by a drag that starts on the
   stage, so it is dropped when a manipulation begins. */
function clearTextSelection(){
  const sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed) sel.removeAllRanges();
}

/* Wheel navigation, from three different input devices reported through one
   event. A trackpad two-finger swipe is a wheel with deltaX/deltaY and no
   modifier — that should pan. A trackpad pinch is a wheel with ctrlKey set —
   that should zoom. A mouse wheel is also modifier-free, but reports line/page
   deltas or large quantised pixel steps with no horizontal component, and a
   mouse has no other way to zoom without reaching for a key. */
const isMouseWheel = e =>
  e.deltaMode !== 0 ||
  (e.deltaX === 0 && Math.abs(e.deltaY) >= 100 && Number.isInteger(e.deltaY));

function wheelNavigation(svg, getView, setView, zoomAt){
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    cancelFly();
    if (e.ctrlKey || e.metaKey) {          // pinch, or an explicit zoom gesture
      zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * 0.01));
      return;
    }
    if (isMouseWheel(e)) {
      zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * 0.0012));
      return;
    }
    const m = svg.getScreenCTM();
    if (!m) return;
    const v = getView();                   // swipe: move the scene under the hand
    setView({...v, x: v.x + e.deltaX / m.a, y: v.y + e.deltaY / m.d});
  }, {passive:false});
}

/* ---------------------------------------------------------------------------
   The stage: one pannable, zoomable surface and everything that makes it
   behave. This is the part every app used to retype — about 120 lines that
   were 90% identical between them, and where the same traps kept recurring.

   Requires motion.js (flyView, cancelFly, clearTextSelection, wheelNavigation).

   createStage({svg, content, objects, onPick, ...}) -> controller
   --------------------------------------------------------------------------- */
function createStage(opts){
  const svg = opts.svg, content = opts.content;
  let PICK = opts.objects || null;                // selector for pickable objects
  const onPick = opts.onPick || (() => {});
  const GAP = opts.panelGap == null ? 16 : opts.panelGap;
  const EDGE = opts.edgePad == null ? 18 : opts.edgePad;

  let view = {x:0, y:0, w:1200, h:700};
  const getView = () => view;
  const setView = v => { view = v; apply(); };

  function apply(){
    svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
    const m = svg.getScreenCTM();
    if (!m) return;
    const pct = Math.round(m.a * 100);
    const out = document.getElementById('st-zoom');
    if (out) out.textContent = 'zoom ' + pct + '%';
    if (opts.lodBelow) svg.classList.toggle(opts.lodClass || 'far', m.a < opts.lodBelow);
    if (opts.onZoom) opts.onZoom(m.a);
    positionEntrances();
  }

  /* Floating panels cover part of the stage, so "fit" must target the part they
     are not covering — otherwise the scene is centred underneath them. Panels
     are classified by the edge they are docked to and by how much of the stage
     they span: a tall narrow one holds a side, a wide short one holds top or
     bottom, a small corner palette holds nothing, and a sheet that covers most
     of the stage is a modal and is ignored. */
  function insets(){
    if (opts.insets) return opts.insets();
    const r = svg.getBoundingClientRect();
    let L = EDGE, R = EDGE, T = EDGE, B = EDGE;
    for (const el of document.querySelectorAll(opts.panels || '.hud')) {
      if (getComputedStyle(el).display === 'none') continue;
      // A surface you opened and will dismiss reserves nothing, the way a menu
      // does not: fitting around it would move the scene out from under you.
      if (el.dataset.transient) continue;
      // A modal says so. Guessing at it by size was fine while no side panel
      // was ever large — then a reading panel could be widened, and a wide
      // tall panel beside the scene was read as a sheet over it and reserved
      // nothing, so Fit centred the whole scene underneath it.
      if (el.classList.contains('modal')) continue;
      const p = el.getBoundingClientRect();
      if (!p.width || !p.height) continue;
      // Classify by the edges a panel is anchored to, never by its height: a
      // side panel is short when its content is short, and would then reserve
      // nothing until it grew and covered the scene.
      const wide = p.width > r.width * 0.45;
      const gL = p.left - r.left, gR = r.right - p.right;
      const gT = p.top - r.top,  gB = r.bottom - p.bottom;
      const nearL = gL < 48, nearR = gR < 48, nearT = gT < 48;
      const lowish = gB < r.height * 0.25;
      let side = null;
      // Anything docked to the bottom reserves its height, however narrow. A
      // corner palette that reserves nothing lets content slide underneath it,
      // which only shows up once the palette grows — at a larger text size, or
      // in an app with one more button in it.
      if (lowish && !nearT) side = 'B';
      else if (nearT && nearL && !nearR) side = 'L';
      else if (nearT && nearR && !nearL) side = 'R';
      else if (nearT && wide) side = 'T';
      if (side === 'L') L = Math.max(L, p.right - r.left + GAP);
      else if (side === 'R') R = Math.max(R, r.right - p.left + GAP);
      else if (side === 'T') T = Math.max(T, p.bottom - r.top + GAP);
      else if (side === 'B') B = Math.max(B, r.bottom - p.top + GAP);
    }
    return {L, R, T, B, w:r.width, h:r.height};
  }

  function framedView(b, pad, maxScale){
    if (!b || !b.width) return;
    const i = insets();
    const availW = Math.max(120, i.w - i.L - i.R);
    const availH = Math.max(120, i.h - i.T - i.B);
    const s = Math.min(availW / (b.width + (pad || 0)), availH / (b.height + (pad || 0)),
                       maxScale || Infinity);
    const target = {w: i.w / s, h: i.h / s};
    target.x = b.x + b.width / 2 - (i.L + availW / 2) / s;
    target.y = b.y + b.height / 2 - (i.T + availH / 2) / s;
    return target;
  }
  function frameBox(b, pad, maxScale){
    finishDepth();
    const target = framedView(b, pad, maxScale);
    if (target) flyView(svg, getView, setView, target);
  }
  const fit = () => { finishDepth(); fitTo(live); };
  const dockedReader = () => document.querySelector('.hud.centered[data-expandable]:not(.modal)');
  function frameAboveReader(el, maxScale){
    const reader = dockedReader();
    if (!reader || !live.contains(el)) return false;
    finishDepth();
    const screen = svg.getBoundingClientRect(), panel = reader.getBoundingClientRect();
    const i = insets(), m = svg.getScreenCTM();
    const bounds = el.getBBox();
    const transform = m.inverse().multiply(el.getScreenCTM());
    const corners = [[bounds.x,bounds.y],[bounds.x+bounds.width,bounds.y],
      [bounds.x,bounds.y+bounds.height],[bounds.x+bounds.width,bounds.y+bounds.height]]
      .map(([x,y]) => new DOMPoint(x,y).matrixTransform(transform));
    const x = Math.min(...corners.map(p=>p.x)), y = Math.min(...corners.map(p=>p.y));
    const w = Math.max(...corners.map(p=>p.x))-x, h = Math.max(...corners.map(p=>p.y))-y;
    const left = screen.left+i.L, right = screen.right-i.R;
    const top = screen.top+i.T, bottom = Math.min(screen.bottom-i.B,panel.top-24);
    if (!w || !h || right<=left || bottom<=top) return false;
    // Preserve the current magnification unless the whole object needs more
    // room. Anchor its lower edge above the reader rather than in empty space.
    const s = Math.min(m.a,(right-left)/w,(bottom-top)/h,maxScale || Infinity);
    const cx = Math.max(left+w*s/2,Math.min(right-w*s/2,panel.left+panel.width/2));
    flyView(svg,getView,setView,{w:screen.width/s,h:screen.height/s,
      x:x+w/2-(cx-screen.left)/s,y:y+h-(bottom-screen.top)/s});
    return true;
  }
  const frame = (el, o) => {
    if (!el) return;
    const c = o || {};
    if (frameAboveReader(el,c.maxScale)) return;
    frameBox(el.getBBox(), c.pad == null ? (opts.framePad == null ? 200 : opts.framePad) : c.pad,
             c.maxScale == null ? (opts.frameMaxScale == null ? 1 : opts.frameMaxScale) : c.maxScale);
  };

  const toWorld = (cx, cy) => {
    const m = svg.getScreenCTM();
    if (!m) return {x:0, y:0};
    const p = svg.createSVGPoint(); p.x = cx; p.y = cy;
    return p.matrixTransform(m.inverse());
  };
  function zoomAt(cx, cy, k){
    finishDepth();
    const p = toWorld(cx, cy);
    view.w *= k; view.h *= k;
    view.x = p.x - (p.x - view.x) * k;
    view.y = p.y - (p.y - view.y) * k;
    apply();
  }
  function zoomStep(k){
    finishDepth();
    const r = svg.getBoundingClientRect();
    const p = toWorld(r.left + r.width / 2, r.top + r.height / 2);
    flyView(svg, getView, setView,
      {w:view.w * k, h:view.h * k,
       x:p.x - (p.x - view.x) * k, y:p.y - (p.y - view.y) * k});
  }

  svg.addEventListener('wheel', () => finishDepth(), {capture:true, passive:true});
  wheelNavigation(svg, getView, setView, zoomAt);

  /* --- pointer: pan, pinch, pick, and standing aside for text ------------- */
  let drag = null, pinch = null;
  const pts = new Map();
  const pinchState = () => {
    const [a, b] = [...pts.values()];
    return {d:Math.hypot(a.x - b.x, a.y - b.y), cx:(a.x + b.x) / 2, cy:(a.y + b.y) / 2};
  };
  const pickFrom = t => (PICK && t && t.closest) ? t.closest(PICK) : null;

  svg.addEventListener('pointerdown', e => {
    finishDepth();
    cancelFly();
    clearTextSelection();
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 2) { pinch = pinchState(); drag = null; svg.classList.remove('dragging'); return; }
    if (e.button !== 0) return;
    if (e.target && e.target.tagName === 'text') {
      // Over a label: the browser owns this drag. Capturing would steal it.
      drag = {textMode:true, moved:false, x:e.clientX, y:e.clientY, hit:pickFrom(e.target)};
      return;
    }
    drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, moved:false, hit:pickFrom(e.target)};
    svg.setPointerCapture(e.pointerId);
    svg.classList.add('dragging');
  });
  svg.addEventListener('pointermove', e => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (drag && drag.textMode) {
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) drag.moved = true;
      return;
    }
    if (pts.size === 2 && pinch) {
      const now = pinchState();
      if (now.d > 0) zoomAt(now.cx, now.cy, pinch.d / now.d);
      pinch = now;
      return;
    }
    if (!drag) return;
    const m = svg.getScreenCTM();
    if (!m) return;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) drag.moved = true;
    view.x = drag.vx - (e.clientX - drag.x) / m.a;
    view.y = drag.vy - (e.clientY - drag.y) / m.d;
    apply();
  });
  const end = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (drag) {
      svg.classList.remove('dragging');
      try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
      if (!drag.moved) {
        let hit = drag.hit || null;
        // Repeating a pick releases selection. Neither action moves the dock.
        if (hit && hit.classList.contains('sel') && document.querySelector('.hud.paired-nav'))
          hit = null;
        markPick(hit); onPick(hit, {dbl:false});
        if (hit && dockedReader()) frame(hit);
      }
    }
    drag = null;
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);

  /* --- depth: a stage can hold another stage ----------------------------
     Every subject worth drawing is hierarchical — a machine holds services, a
     document holds sections, a call holds a turn. One flat stage forces you to
     pick a level and flatten the rest. Entering pushes a level with its own
     content, its own camera, its own pickable objects and its own index;
     leaving restores all four. A level that kept the level above it in any of
     those reads as a different app the moment you go inside something. */
  const levels = [];              // back.map embeds the interior in its parent object
  const rootContent = content;
  let live = content;                                  // the group drawn into now
  let depthFinish = null;
  function finishDepth(){ if (depthFinish) depthFinish(); }

  const mapView = (v, m) => ({x:m.x + v.x * m.s, y:m.y + v.y * m.s,
                             w:v.w * m.s, h:v.h * m.s});
  const inverse = m => ({x:-m.x / m.s, y:-m.y / m.s, s:1 / m.s});
  const compose = (a, b) => ({x:a.x + a.s * b.x, y:a.y + a.s * b.y, s:a.s * b.s});
  // Shared scenery (for example the grid beside #content) must not jump when
  // the camera is expressed in the next level's local units at the endpoint.
  const scenery = [...content.parentNode.children].filter(n => n !== content
    && n instanceof SVGGraphicsElement && !['defs', 'clipPath', 'mask'].includes(n.localName));
  let sceneryMap = {x:0, y:0, s:1};
  const sceneryLayers = new Map();
  function rebaseScenery(m){
    sceneryMap = compose(m, sceneryMap);
    for (const node of scenery) {

  wire(opts.fitBtn || '#fit', () => (levels.length ? fitTo(live) : fit()));

     going up a level is navigation, and the palette is about the camera. Apps
     with no navigator keep it in the palette, which is where it can go. */

    const b = document.createElement('button');
    b.type = 'button'; b.id = 'stage-back'; b.className = 'btn';

      bar.hidden = true;                    // there is no way up from the top
      bar.appendChild(b);

      const tools = document.querySelector('.tools');
      if (tools) tools.insertBefore(b, tools.firstChild);
    }
  }
  paintDepth();
  /* The first paint of the navigator is deferred by a microtask: the app calls
     createStage in the middle of its own script, so its index function and the
     things it closes over may not be initialised yet. Same trap as onDepth. */
  queueMicrotask(() => { entrancesReady = true; refresh(); });

  initStatusTools();
  const statusBack = document.getElementById('stage-back');
  if (statusBack) placeBack(statusBack);
  initPanels(() => {
    const selected = live.querySelector('.sel');
    if (selected && dockedReader()) frame(selected); else refit();
  }, () => {
    const back = document.getElementById('stage-back');
    if (back) placeBack(back);
  });
  initHelp();
  initTextScale(
    () => {                                  // the chrome resized; keep the aspect honest
      finishDepth();                         // do not animate across a resize
      stackAboveTools();                     // the palette just changed height
      const r = svg.getBoundingClientRect();
      if (r.width && r.height) { view.h = view.w * (r.height / r.width); apply(); }

    () => { const i = insets();

  // Their normal-flow height changes the stage's actual viewport.
  if (self.ResizeObserver) new ResizeObserver(() => {
    finishDepth();
    stackAboveTools();

  }).observe(svg);

          enter, back, backTo, paintNav, markPick, refresh, snapshotLevels, replaceLevels,
          depth: () => levels.length, level: () => live, root: () => rootContent};
}

/* ---------------------------------------------------------------------------
   How this works.

   Every app had a sentence of guidance parked in the status bar — the widest
   cell, holding the least durable thing in it. Guidance is not state: it does
   not change as you work, it is what you read once and then stop needing, and
   it was squeezing the readouts that do change. So it goes behind a control,
   next to the other controls for the surface it explains.

   The sheet opens from the view palette, above it, because the palette is
   where you already reach to work the stage. It carries the app's own running
   hint first — the only part that is different here and now — and then the
   gestures, which are the same in every app built on the kit and had never
   been written down anywhere a user could find them.
   --------------------------------------------------------------------------- */

  <dt>Drag</dt><dd>pan the scene</dd>
  <dt>Wheel, or pinch</dt><dd>zoom about the pointer</dd>
  <dt>Two-finger swipe</dt><dd>pan, on a trackpad</dd>
  <dt>Click an object</dt><dd>select it, and read it in the side panel</dd>
  <dt>Double-click an object</dt><dd>go inside it, or frame it if it has no inside</dd>
  <dt>Double-click the background</dt><dd>fit this level, or come up out of it</dd>
  <dt>Escape</dt><dd>closes the reader, then comes up a level, then clears the selection</dd>
  <dt><kbd>+</kbd> <kbd>-</kbd> <kbd>0</kbd></dt><dd>text size, and back to 100%</dd>

  toggle.innerHTML = `<svg class="icon" viewBox="0 -960 960 960" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path d="M207.858-432Q188-432 174-446.142q-14-14.141-14-34Q160-500 174.142-514q14.141-14 34-14Q228-528 242-513.858q14 14.141 14 34Q256-460 241.858-446q-14.141 14-34 14Zm272 0Q460-432 446-446.142q-14-14.141-14-34Q432-500 446.142-514q14.141-14 34-14Q500-528 514-513.858q14 14.141 14 34Q528-460 513.858-446q-14.141 14-34 14Zm272 0Q732-432 718-446.142q-14-14.141-14-34Q704-500 718.142-514q14.141-14 34-14Q772-528 786-513.858q14 14.141 14 34Q800-460 785.858-446q-14.141 14-34 14Z"/></svg>`;

     purpose and gets out of the way; zoom and text size are adjusted by
     repetition, so it stays. Nothing about this is inferred at test time —
     the list is here, and the checks read the real state afterwards. */
  tools.addEventListener('click', e => {

  tools.addEventListener('keydown', e => {

   that sits above it cannot hold a constant offset — peer-sim's playback bar

   written and stopped being true the moment the palette gained a control.
   Everything stacked above the palette is placed from where the palette
   actually is: the help sheet, and anything an app marks data-above-tools. */
function stackAboveTools(){
  const app = document.querySelector('.app');
  const tools = document.querySelector('.tools');
  if (!app || !tools) return;
  const a = app.getBoundingClientRect();
  const t = (tools.closest('.status') || tools).getBoundingClientRect();
  const foot = Math.max(14, Math.round(a.bottom - t.top + 10));
  let stack = foot;
  for (const el of document.querySelectorAll('[data-above-tools]')) {
    if (el.hidden || getComputedStyle(el).display === 'none') continue;

  }
  app.style.setProperty('--reader-bottom', stack + 'px');
  const sheet = document.getElementById('help');
  if (sheet && !sheet.hidden) {
    sheet.style.bottom = foot + 'px';
    sheet.style.maxHeight = Math.max(120, Math.round(a.height - foot - 14)) + 'px';

   still working" and "I am only reading" — so they are two controls, not one
   that cycles. The runbook had the first of them as a "Wide read" button up in

/* Where the window is narrow the panel already spans it, so there is no width

   system which edges it is docked to answers "both" for every panel. */
function syncWiden(panel){
  const w = panel.querySelector('.widen');
  if (!w) return;
  const app = document.querySelector('.app');
  if (!app) return;
  // Full-page geometry must not erase the width to restore on dismissal.
  if (panel.classList.contains('modal')) return;
  if (panel.classList.contains('centered')) {
    w.hidden = app.clientWidth <= 384;
    return;

  const a = app.getBoundingClientRect(), p = panel.getBoundingClientRect();
  if (!p.width) return;                          // hidden; ask again on resize

  const panel = document.querySelector('.hud.modal');

/* ---------------------------------------------------------------------------
   Text scale. The stage has a camera; the text layer needs its own control, or
   the only way to enlarge the reading is browser zoom — which rescales the
   scene too, and collides with ctrl+wheel already meaning pinch-zoom here.
   Controls are injected into the view palette so every app gets them.
   --------------------------------------------------------------------------- */
const UI_STEPS = [0.85, 1, 1.15, 1.3, 1.5];
const UI_KEY = 'orrery.uiScale';
let uiIndex = 1;

function initTextScale(onChange, room){
  const tools = document.querySelector('.tools');
  if (!tools || tools.querySelector('.size')) return;

  try {
    const saved = UI_STEPS.indexOf(parseFloat(localStorage.getItem(UI_KEY)));
    if (saved >= 0) uiIndex = saved;
  } catch (_) {}

  const mk = (id, label, html, cls) => {
    const b = document.createElement('button');
    b.type = 'button'; b.id = id; b.className = 'btn' + (cls ? ' ' + cls : '');
    if (label) b.setAttribute('aria-label', label);
    b.innerHTML = html;
    tools.appendChild(b);
    return b;
  };
  const sep = document.createElement('span');
  sep.className = 'sep';
  tools.appendChild(sep);

  const down = mk('text-down', 'Smaller text', `<svg class="icon" viewBox="0 -960 960 960" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path d="M640-450q-13 0-21.5-8.5T610-480q0-13 8.5-21.5T640-510h250q13 0 21.5 8.5T920-480q0 13-8.5 21.5T890-450H640ZM172-350l-49 128q-4 10-12.5 16T91-200q-19 0-29-15.5T59-248l192-488q5-11 14-17.5t20-6.5h30q11 0 20 6.5t14 17.5l192 489q7 17-3.5 32T509-200q-11 0-20-6t-13-17l-48-127H172Zm24-64h208L302-685h-4L196-414Z"/></svg>`);
  const read = mk('text-size', 'Reset text size', '100%', 'size');
  const up = mk('text-up', 'Larger text', `<svg class="icon" viewBox="0 -960 960 960" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false"><path d="m172-350-49 128q-4 10-12.556 16-8.555 6-19.444 6-19 0-29-15.5T59-248l192-488q5-11 14.158-17.5T285-760h30q11.447 0 20.224 6.5Q344-747 349-736l192 489q7 17-3.547 32t-28.515 15q-10.938 0-20.041-6.133Q479.793-212.267 476-223l-48-127H172Zm24-64h208L302-685h-4L196-414Zm534-36H630q-12.75 0-21.375-8.675-8.625-8.676-8.625-21.5 0-12.825 8.625-21.325T630-510h100v-100q0-12.75 8.675-21.375 8.676-8.625 21.5-8.625 12.825 0 21.325 8.625T790-610v100h100q12.75 0 21.375 8.675 8.625 8.676 8.625 21.5 0 12.825-8.625 21.325T890-450H790v100q0 12.75-8.675 21.375-8.676 8.625-21.5 8.625-12.825 0-21.325-8.625T730-350v-100Z"/></svg>`);
  read.title = 'Reset text size';

  function apply(notify){
    const v = UI_STEPS[uiIndex];
    document.documentElement.style.setProperty('--ui-scale', String(v));
    read.textContent = Math.round(v * 100) + '%';
    down.disabled = uiIndex === 0;
    up.disabled = uiIndex === UI_STEPS.length - 1 || capped;
    read.title = capped
      ? 'No room for larger text in this window. Click to reset.'
      : 'Reset text size';
    try { localStorage.setItem(UI_KEY, String(v)); } catch (_) {}
    if (notify !== false && onChange) onChange();
  }
  /* Bigger text means bigger panels, and panels float over the stage. Growing
     until the scene has no room left is not a legible interface, so a step that
     would leave less than a usable stage is refused and the control stops. */
  let capped = false;
  const step = d => {
    const prev = uiIndex;
    uiIndex = Math.max(0, Math.min(UI_STEPS.length - 1, uiIndex + d));
    if (d < 0) capped = false;
    apply();
    if (d > 0 && room) {
      const r = room();
      if (r.w < 260 || r.h < 200) { uiIndex = prev; capped = true; apply(); }
    }
  };

  // or a notify that resizes the chrome would call this straight back.
  addEventListener('resize', () => { capped = false; apply(false); });
  down.onclick = () => step(-1);
  up.onclick = () => step(1);
  read.onclick = () => { uiIndex = UI_STEPS.indexOf(1); apply(); };

  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;          // leave browser zoom alone
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); step(1); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); step(-1); }
    else if (e.key === '0') { e.preventDefault(); uiIndex = UI_STEPS.indexOf(1); apply(); }
  });

  apply();
}

/* A single hierarchy for the drawing, navigation, and interior ownership.
   Include after stage.js. Draw callbacks draw only their own object's geometry;
   Orrery creates object groups, child groups, labels, picking and index rows. */
function validateStageModel(model){
  const stages = new Map(), owners = new Map(), active = new Set(), objects = new Set();
  function visit(stage, owner){
    if (!stage || typeof stage.id !== 'string' || !stage.id ||
        typeof stage.label !== 'string' || !stage.label || !Array.isArray(stage.items))
      throw new Error('Each stage needs a nonempty id, label, and items array');
    if (active.has(stage)) throw new Error(`Stage cycle at ${stage.id}`);
    if (stages.has(stage.id)) {
      if (stages.get(stage.id) !== stage) throw new Error(`Duplicate stage id: ${stage.id}`);
      if (owners.get(stage) !== owner && stage.shared !== true)
        throw new Error(`Interior ${stage.id} has multiple owners; declare shared: true only for intentional sharing`);
      return;
    }
    stages.set(stage.id, stage); owners.set(stage, owner); active.add(stage);
    const ids = new Set();
    function items(list){
      if (!Array.isArray(list)) throw new Error('children must be an array');
      for (const item of list) {
        if (!item || typeof item.id !== 'string' || !item.id || ids.has(item.id))
          throw new Error(`Missing or duplicate object id in stage ${stage.id}`);
        ids.add(item.id);
        if (objects.has(item)) throw new Error(`Object ${item.id} is reused in different places; declare distinct objects`);
        objects.add(item);
        if (typeof item.label !== 'string' || !item.label || typeof item.draw !== 'function')
          throw new Error(`Object ${item.id} needs a label and draw(g, item)`);
        if (item.parent != null) throw new Error(`Use children for ${item.id}'s hierarchy, not a separate parent field`);
        if (item.children != null) items(item.children);
        if (item.interior != null) visit(item.interior, item);
      }
    }
    items(stage.items); active.delete(stage);
  }
  visit(model, null);
  return true;
}

function createModelStage(opts){
  let model = opts.model;
  validateStageModel(model);
  if (opts.index || opts.objects || opts.onEnter)
    throw new Error('createModelStage derives index, objects, and onEnter from model; use createStage for custom callbacks');
  if (opts.content.childElementCount)
    throw new Error('createModelStage needs an empty content group');
  const nodes = new WeakMap(), drawn = new WeakMap(), descriptors = new WeakMap();
  const ns = 'http://www.w3.org/2000/svg';
  function drawLevel(host, spec){
    drawn.set(host, spec);
    function drawItems(parent, items, depth){
      for (const item of items) {
        const group = document.createElementNS(ns,'g');
        group.classList.add('orrery-object');
        group.dataset.objectId = item.id;
        group.dataset.modelDepth = String(depth);
        group.setAttribute('aria-label',item.label);
        group.setAttribute('role','button'); group.setAttribute('tabindex','0');
        group.orreryOwner = item;
        parent.appendChild(group); nodes.set(group,item);
        const own = document.createElementNS(ns,'g'); group.appendChild(own);
        item.draw(own,item);
        const box = own.getBBox();
        if (!box.width && !box.height)
          throw new Error(`Object ${item.id} has no drawn geometry; context belongs in the path, not an index row`);
        if (item.children) drawItems(group,item.children,depth+1);
      }
    }
    drawItems(host,spec.items,0);
  }
  function descriptor(spec){
    if (!descriptors.has(spec)) descriptors.set(spec, {
      id:spec.id, label:spec.label, shared:spec.shared,
      objects:'g.orrery-object', draw:g=>{ validateStageModel(model); drawLevel(g,spec); },
      onEnter:node=>{
        const item = nodes.get(node);
        return item?.interior ? descriptor(item.interior) : null;
      },
    });
    return Object.assign(descriptors.get(spec), {id:spec.id,label:spec.label,shared:spec.shared});
  }
  const root = descriptor(model);
  drawLevel(opts.content,model);
  const stage = createStage({...opts,rootLabel:model.label,objects:root.objects,onEnter:root.onEnter});
  return {...stage,
    replaceModel(next, {preserveCamera=true}={}){
      validateStageModel(next);
      const previous=stage.snapshotLevels(), frames=[];
      let spec=next;
      // Match both the owner and interior identity, never just a stage label.
      // All retained ancestors are redrawn so Back cannot restore stale state.
      try {
        for (let i=0;spec;i++) {
          const g=document.createElementNS(ns,'g');
          g.style.visibility='hidden'; opts.content.parentNode.appendChild(g);
          const frame={...descriptor(spec),g,ownerId:previous[i]?.ownerId,

          frames.push(frame); drawLevel(g,spec);
          if (i) {
            const b=frame.owner.getBBox(), inner=g.getBBox();

              (b.height||1)/(inner.height||1))*0.9);
            frame.map={s,x:b.x+b.width/2-s*(inner.x+inner.width/2),
              y:b.y+b.height/2-s*(inner.y+inner.height/2)};
          }
          const old=previous[i+1];
          if (!old || (!i && next.id!==drawn.get(previous[0].g)?.id)) break;
          const owner=[...g.querySelectorAll('.orrery-object')]
            .find(n=>n.dataset.objectId===old.ownerId);
          const interior=nodes.get(owner)?.interior;
          if (!interior || interior.id!==drawn.get(old.g)?.id) break;
          spec=interior;
          // Carry the replacement owner into the next prepared frame.
          frames[i].nextOwner=owner;
        }

      model=next;
      stage.replaceLevels(frames);
      drawn.set(opts.content,next);
      return {depth:frames.length-1, previousDepth:previous.length-1,
        returned:frames.length<previous.length,label:frames.at(-1).label};
    },
    enter(node){
      validateStageModel(model);
      const item = nodes.get(node);
      if (item?.interior) stage.enter(node,descriptor(item.interior));

    refresh(){ validateStageModel(model); stage.refresh(); },
    redraw(){

      stage.fit();

      const draft = document.createElementNS(ns,'g');
      draft.style.visibility = 'hidden'; host.after(draft);
      try { drawLevel(draft,spec); } catch (error) { draft.remove(); throw error; }
      host.replaceChildren(...draft.childNodes); draft.remove();
      stage.refresh(); stage.fit();
    },
  };
}

/* Scenario = conditions; view = representation; depth = containment.
   Include after model.js. A synchronous, pure build(context) returns the whole
   hierarchy. The kit reconciles its location and owns the choice controls. */
function createContextStage(opts){
  const {defaults={},scenarios=[],views=[],build,controls,onChange}=opts;
  if (typeof build!=='function' || !controls || !views.length)
    throw new Error('createContextStage needs build, a controls element, and views');
  const scalar=v=>v===null || ['string','boolean'].includes(typeof v)
    || (typeof v==='number' && Number.isFinite(v));
  const base=Object.freeze({...defaults});
  function settings(values){
    if (!values || typeof values!=='object' || Array.isArray(values))
      throw new Error('Settings must be a flat object');
    for (const [k,v] of Object.entries(values))
      if (!Object.hasOwn(base,k) || !scalar(v)) throw new Error(`Invalid setting: ${k}`);
    return {...values};
  }
  settings(base);
  function choices(list,kind){
    const ids=new Set();
    return list.map(s=>{
      if (!s || typeof s.id!=='string' || !s.id || ids.has(s.id)
        || typeof s.label!=='string' || !s.label) throw new Error(`Invalid ${kind} id or label`);
      ids.add(s.id);
      if (kind==='scenario' && !['replace','patch'].includes(s.mode))
        throw new Error('Each scenario must declare mode: replace or patch');
      return Object.freeze({...s,...(kind==='scenario'?{values:Object.freeze(settings(s.values))}:{})});
    });
  }
  const presets=choices(scenarios,'scenario'), modes=choices(views,'view');
  const lookup=(list,id)=>{
    const choice=list.find(s=>s.id===id);
    if (!choice) throw new Error(`Unknown choice: ${id}`);
    return choice;
  };
  const matches=(s,values)=>Object.entries(s.mode==='replace'?{...base,...s.values}:s.values)
    .every(([k,v])=>Object.is(values[k],v));
  function snapshot(values,view,preferred){
    const scenario=presets.find(s=>s.id===preferred && matches(s,values))
      || presets.find(s=>matches(s,values));
    return Object.freeze({settings:Object.freeze({...values}),view,scenario:scenario?.id || null});
  }
  let initial={...base};
  if (opts.initialScenario) Object.assign(initial,lookup(presets,opts.initialScenario).values);
  let current=snapshot(initial,lookup(modes,opts.initialView || modes[0].id).id,opts.initialScenario);
  const stage=createModelStage({...opts,model:build(current)});
  controls.classList.add('context-controls');
  const buttons=[];
  function group(label,list,select){
    const host=document.createElement('div'); host.className='context-group';
    host.setAttribute('role','group'); host.setAttribute('aria-label',label);
    const name=document.createElement('span'); name.className='context-label'; name.textContent=label;
    host.appendChild(name);
    for (const s of list) {
      const b=document.createElement('button'); b.type='button'; b.className='btn';
      b.textContent=s.label; b.dataset.contextKind=label.toLowerCase(); b.dataset.contextId=s.id;
      b.onclick=()=>select(s.id); buttons.push(b); host.appendChild(b);
    }
    controls.appendChild(host);
  }
  controls.replaceChildren();
  if (presets.length) group('Scenario',presets,id=>api.setScenario(id));
  group('View',modes,id=>api.setViewMode(id));
  const status=document.createElement('span'); status.className='context-status';
  status.setAttribute('role','status'); status.setAttribute('aria-live','polite');
  controls.appendChild(status);
  function paint(change={}){
    for (const b of buttons) b.setAttribute('aria-pressed',String(current[b.dataset.contextKind]===b.dataset.contextId));
    status.textContent=[presets.length && !current.scenario?'Custom settings':'',
      change.returned?`Returned to ${change.label}: the previous interior is unavailable in this context.`:'']
      .filter(Boolean).join('. ');
  }
  function commit(values,view,preferred){
    const next=snapshot(values,view,preferred);
    const before=opts.svg.getBoundingClientRect();
    // A failing builder, validator or draw leaves both controls and drawing intact.
    const change=stage.replaceModel(build(next),{preserveCamera:next.view===current.view});
    current=next; paint(change);
    // A wrapped notice can change the stage's height without a window resize.
    const after=opts.svg.getBoundingClientRect();
    if (after.width && after.height && (before.width!==after.width || before.height!==after.height)) {
      const camera=stage.getView();
      stage.setView({...camera,h:camera.w*after.height/after.width});
    }
    onChange?.(current,change);
    return change;
  }
  const api={...stage,
    context:()=>current,
    setScenario(id){
      const s=lookup(presets,id);
      return commit({... (s.mode==='replace'?base:current.settings),...s.values},current.view,id);
    },
    setSettings(values){return commit({...current.settings,...settings(values)},current.view,current.scenario);},
    setViewMode(id){return commit(current.settings,lookup(modes,id).id,current.scenario);},
  };
  // Direct model replacement would bypass context ownership.
  delete api.replaceModel;
  paint(); onChange?.(current,{depth:0,previousDepth:0,returned:false});
  return api;
}

/* ---------- who may call what: SecurityConfig, in order ---------- */
const RULES = [
  [null,'/error','permit'],
  ['GET','/api/auth/me','auth'],
  ['POST','/api/auth/login','permit'],
  ['POST','/api/auth/register','ADMIN'],
  [null,'/swagger-ui.html|/swagger-ui/**|/v3/api-docs/**','auth'],
  [null,'/actuator/health/**','permit'],
  ['GET','/api/terms/**','auth'], [null,'/api/terms/**','ADMIN'],
  ['GET','/api/courses/options','TEACHER,ADMIN'], ['GET','/api/courses/**','auth'], [null,'/api/courses/**','TEACHER,ADMIN'],
  ['GET','/api/students/me','auth'], ['GET','/api/enrollments/student/**','auth'],
  ['GET','/api/students/**','TEACHER,ADMIN'], [null,'/api/students/**','ADMIN'],
  ['GET','/api/teachers/**','TEACHER,ADMIN'], [null,'/api/teachers/**','ADMIN'],
  ['POST','/api/enrollments','STUDENT,TEACHER,ADMIN'],
  ['PATCH','/api/enrollments/*/cancel','STUDENT,TEACHER,ADMIN'],
  ['PATCH','/api/enrollments/*/grade-seen','STUDENT'],
  ['DELETE','/api/enrollments/**','ADMIN'],
  [null,'/api/enrollments/**','TEACHER,ADMIN'],
  [null,'**','auth'],
];
function patternRegex(p){
  return new RegExp('^(?:' + p.split('|').map(x => {
    if (x === '**') return '.*';
    const tail = x.endsWith('/**');
    if (tail) x = x.slice(0, -3);
    return x.split('*').map(s => s.replace(/[.+?^$()\[\]\\]/g, '\\$&')).join('[^/]+') + (tail ? '(?:/.*)?' : '');
  }).join('|') + ')$');
}
const COMPILED = RULES.map(([m, p, a]) => ({m, p, a, re: patternRegex(p)}));
const ROLE_LABEL = {anonymous:'Anonymous', student:'Student', teacher:'Teacher', admin:'Admin'};
function access(role, ep){
  const path = ep.path.replace(/\{[^}]+\}/g, 'x1');
  const rule = COMPILED.find(r => (!r.m || r.m === ep.verb) && r.re.test(path));
  const who = rule.a === 'permit' ? 'everyone, signed in or not'
            : rule.a === 'auth' ? 'any signed-in user' : rule.a.split(',').map(s => s[0] + s.slice(1).toLowerCase()).join(' or ');
  const R = role.toUpperCase();
  const ok = rule.a === 'permit' || (rule.a === 'auth' ? role !== 'anonymous' : rule.a.split(',').includes(R));
  const guard = (ep.pre.match(/@ownershipGuard\.(\w+)/) || [])[1] || '';
  return {ok, rule: `${rule.m || 'any'} ${rule.p.replace(/\|/g,' , ')}`, who, guard,
          status: ok ? 200 : role === 'anonymous' ? 401 : 403};
}

/* ---------- drawing helpers ---------- */
const clip = (s, px, size, mono) => { const n = Math.max(4, Math.floor(px / (size * (mono ? 0.6 : 0.56)))); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function el(name, attrs, text){ const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
function card(x, y, w, h, lines, cls = ''){
  return (g, item) => {
    g.setAttribute('class', 'card ' + cls);
    g.append(el('rect', {x, y, width: w, height: h, rx: 12, 'data-face': ''}));
    let ty = y + 29;
    for (const [k, t, size, mono] of lines) {
      g.append(el('text', {x: x + 16, y: ty, class: k}, clip(t, w - 32, size, mono)));
      ty += k === 't1' || k === 't1m' ? 23 : 20;
    }
  };
}
function scope(x, y, w, h, title, sub){
  return g => {
    g.setAttribute('class', 'scope');
    g.append(el('rect', {x, y, width: w, height: h, rx: 16, 'data-face': ''}),
             el('text', {x: x + 24, y: y + 33}, title), el('text', {x: x + 24, y: y + 54, class: 'sub'}, sub));
  };
}
const grid = (i, cols, w, h, gap, x0, y0) => [x0 + (i % cols) * (w + gap), y0 + Math.floor(i / cols) * (h + gap)];

/* ---------- interiors ---------- */
function interiorOf(c, role){
  const W = 340, H = 104, GAP = 22, COLS = 3, X0 = 40, Y0 = 60;
  let items = [];
  if (c.layer === 'web') {
    items = c.endpoints.map((ep, i) => {
      const a = access(role, ep), own = a.ok && a.guard;
      const [x, y] = grid(i, COLS, W, H, GAP, X0, Y0);
      const badge = a.ok ? (own ? `ALLOWED · then ownership check` : 'ALLOWED') : `BLOCKED · ${a.status}`;
      return {id: 'ep' + i, label: `${ep.verb} ${ep.path}`, meta: {kind: 'endpoint', ep, a, cls: c},
        draw: (g, it) => { card(x, y, W, H, [['t1m', `${ep.verb} ${ep.path}`, 14, true], ['t2', `${ep.name}()`, 12.5, true], ['badge', badge, 12]],
          a.ok ? (own ? 'own' : 'allow') : 'deny')(g, it); const t = g.querySelector('.badge'); t.setAttribute('class', 'badge'); }};
    });
  } else if (c.layer === 'service' || c.layer === 'data' || c.layer === 'cross') {
    const readOnly = c.ann.some(([a, g]) => a === 'Transactional' && /readOnly\s*=\s*true/.test(g));
    items = c.methods.map((m, i) => {
      const [x, y] = grid(i, COLS, W, H, GAP, X0, Y0);
      const tx = m.ann.find(([a]) => a === 'Transactional');
      const note = c.layer === 'service' ? (tx ? 'write transaction' : readOnly ? 'read-only transaction' : '') :
                   m.ann.filter(([a]) => a !== 'Override').map(([a]) => '@' + a).join(' ');
      return {id: 'm' + i, label: m.name, meta: {kind: 'method', m, cls: c, tx: !!tx, readOnly},
        draw: card(x, y, W, H, [['t1m', m.name + '()', 14, true], ['t2', '→ ' + m.ret, 12.5, true], ['t3', note, 13]])};
    });
  } else {
    items = c.fields.map((f, i) => {

        draw: card(x, y, W, H, [['t1m', f.name, 14, true], ['t2', f.type, 12.5, true], ['t3', tags, 13]])};
    });
  }
  return items.length ? {id: 'in-' + c.id, label: c.id, items} : null;
}

function classCard(c, role, x, y, w, h){
  const anns = decoAnns(c).slice(0, 3).map(([a]) => '@' + a).join(' ');
  let third = '', cls = '';
  if (c.layer === 'web') {
    const open = c.endpoints.filter(e => access(role, e).ok).length;
    third = `${open} of ${c.endpoints.length} endpoints open to ${ROLE_LABEL[role]}`;
    if (!open) cls = 'dim';
  } else if (c.layer === 'service' || c.layer === 'data' || c.layer === 'cross') third = c.methods.length ? `${c.methods.length} methods` : (c.kind === 'interface' ? 'interface' : '');
  else third = `${c.fields.length} fields`;
  return card(x, y, w, h, [['t1', c.id, 17], ['t2', anns, 12.5, true], ['t3', third, 13]], cls);
}

const LAYER_SHORT = {web: 'controller', service: 'service', data: 'repository', domain: 'entity', request: 'request', cross: 'shared'};
const featureOf = c => { const p = c.path.split('/'); return p[2] === 'feature' ? p[3] : p[2]; };
function rayRect(cx, cy, w, h, dx, dy){   // where a ray from the origin toward (dx, dy) meets a rectangle
  const t = Math.min(dx ? (w / 2) / Math.abs(dx) : Infinity, dy ? (h / 2) / Math.abs(dy) : Infinity);
  return [cx - dx * t, cy - dy * t];
}
function featuresModel(role){
  const names = [...new Set(CLASSES.map(featureOf))].sort((a, b) => (a === 'shared') - (b === 'shared') || a.localeCompare(b));
  const W = 230, H = 72, GAP = 14, PAD = 22, HEAD = 66, RX = 1020, RY = 820;
  const CW = 300, CH = 96;
  const boxes = names.map((n, i) => {
    const cs = CLASSES.filter(c => featureOf(c) === n).sort((a, b) => LAYERS.findIndex(l => l[0] === a.layer) - LAYERS.findIndex(l => l[0] === b.layer));
    const cols = cs.length > 8 ? 3 : 2, rows = Math.ceil(cs.length / cols);
    const w = cols * W + (cols - 1) * GAP + 2 * PAD, h = HEAD + rows * H + (rows - 1) * GAP + PAD;
    const a = (-90 + i * 360 / names.length) * Math.PI / 180;
    return {n, cs, cols, w, h, cx: Math.cos(a) * RX, cy: Math.sin(a) * RY};
  });
  const items = [{id: 'fx-centre', label: 'Backend', meta: {kind: 'layer', id: 'backend', title: 'Student Manager backend', sub: `${names.length} areas: ${names.join(', ')}. Each area gathers the controller, service, repository, entity and request classes that belong together.`, n: CLASSES.length, unit: 'classes'},
    draw: (g, it) => {
      card(-CW / 2, -CH / 2, CW, CH, [['t1', 'Student Manager', 19], ['t3', `backend · ${CLASSES.length} classes`, 13]])(g, it);
      for (const b of boxes) {
        const [x, y] = rayRect(b.cx, b.cy, b.w, b.h, b.cx, b.cy), [x0, y0] = rayRect(0, 0, CW, CH, -b.cx, -b.cy);
        g.prepend(el('path', {class: 'flow', d: `M${x0},${y0}L${x},${y}`}));
      }
    }}];
  for (const b of boxes) {
    const x0 = b.cx - b.w / 2, y0 = b.cy - b.h / 2;
    items.push({id: 'fx-' + b.n, label: b.n[0].toUpperCase() + b.n.slice(1), meta: {kind: 'layer', id: b.n, title: b.n[0].toUpperCase() + b.n.slice(1), sub: b.n === 'shared' ? 'Base classes, security, configuration and error handling used by every area.' : `Everything the ${b.n} area is made of, from its controller down to its entity.`, n: b.cs.length, unit: 'classes'},
      draw: scope(x0, y0, b.w, b.h, b.n[0].toUpperCase() + b.n.slice(1), `${b.cs.length} classes`),
      children: b.cs.map((c, i) => {
        const [x, y] = grid(i, b.cols, W, H, GAP, x0 + PAD, y0 + HEAD);
        const open = c.layer === 'web' ? c.endpoints.filter(e => access(role, e).ok).length : 0;
        const third = c.layer === 'web' ? `controller · ${open}/${c.endpoints.length} endpoints open` : LAYER_SHORT[c.layer] + (c.kind === 'interface' ? ' · interface' : '');
        return {id: c.id, label: c.id, meta: {kind: 'class', c}, interior: interiorOf(c, role),
          draw: card(x, y, W, H, [['t1', c.id, 16], ['t3', third, 13]], 'l-' + c.layer + (c.layer === 'web' && !open ? ' dim' : ''))};
      })});
  }
  return {id: 'features', label: 'Features', items};
}

const LANES = [
  ['seen',   'A student confirms they have seen a grade', 'EnrollmentController', 'markGradeSeen'],
  ['enroll', 'Someone enrolls a student in a course',     'EnrollmentController', 'create'],
  ['grade',  'A teacher enters a grade',                  'EnrollmentController', 'updateGrade'],
];
function laneSteps(role, ctlId, epName){
  const ctl = CLASSES.find(c => c.id === ctlId), ep = ctl.endpoints.find(e => e.name === epName), a = access(role, ep);
  const svc = CLASSES.find(c => c.layer === 'service' && (ctl.deps.includes(c.id) || ctl.deps.includes(c.implements)));
  const m = svc && svc.methods.find(x => x.name === epName);
  const repo = svc && CLASSES.find(c => c.layer === 'data' && svc.deps.includes(c.id) && svc.id.startsWith(c.id.replace(/Repository$/, '')));
  const ent = repo && CLASSES.find(c => c.layer === 'domain' && c.id === (repo.extends.match(/<(\w+)>/) || [])[1]);
  const tx = m && m.ann.some(([n]) => n === 'Transactional');
  const ro = svc && svc.ann.some(([n, g]) => n === 'Transactional' && /readOnly\s*=\s*true/.test(g));
  const stopped = !a.ok, own = a.ok && a.guard;
  const why = {
    url: 'The first gate. SecurityConfig lists URL rules in order and the first rule that matches decides who may pass.',
    method: '@PreAuthorize runs just before the controller method. OwnershipGuard then checks that this particular record belongs to the caller: a student\'s own data, a teacher\'s own course.',
    service: 'The service holds the business rules and opens the transaction. Nothing below it knows who the caller is.',
    repo: 'The repository talks to the database through Spring Data JPA.',
    entity: 'The entity is the row that is read or changed. BaseEntity adds id, audit fields and a version.',
  };
  return [
    {key: 'url', n: 1, title: 'URL rule', detail: `${a.rule}`, verdict: stopped ? `stops here · HTTP ${a.status}` : `passes (${a.who})`, cls: stopped ? 'deny' : 'allow', open: 'SecurityConfig', why: why.url, a},
    {key: 'method', n: 2, title: `${ctl.id}.${ep.name}()`, detail: ep.pre || 'no @PreAuthorize on this method', verdict: stopped ? 'not reached' : own ? `ownership check: ${a.guard}` : 'passes', cls: stopped ? 'dim' : own ? 'own' : 'allow', open: ctl.id, why: why.method, a},
    {key: 'service', n: 3, title: svc ? svc.id : '—', detail: m ? `${m.name}()` : '', verdict: stopped ? 'not reached' : tx ? 'write transaction' : ro ? 'read-only transaction' : 'runs', cls: stopped ? 'dim' : '', open: svc && svc.id, why: why.service, a},
    {key: 'repo', n: 4, title: repo ? repo.id : '—', detail: 'Spring Data JPA', verdict: stopped ? 'not reached' : repo ? `${repo.methods.length} queries` : '', cls: stopped ? 'dim' : '', open: repo && repo.id, why: why.repo, a},
    {key: 'entity', n: 5, title: ent ? ent.id : '—', detail: 'JPA entity', verdict: stopped ? 'not reached' : ent ? `${ent.fields.length} fields` : '', cls: stopped ? 'dim' : '', open: ent && ent.id, why: why.entity, a},
  ];
}
function journeyModel(role){
  const W = 280, H = 126, GAP = 40, PAD = 24, HEAD = 74;

    h = `<h3 class="mono">${st.n} · ${esc(st.title)}</h3><p><span class="pill">${esc(ep.verb)} ${esc(ep.path)}</span></p><p>${esc(st.why)}</p>
    <h4>${esc(ROLE_LABEL[r])}</h4><p>${st.cls === 'deny' ? '<span class="pill no">stopped here</span>' : st.cls === 'dim' ? '<span class="pill">never reached</span>' : st.cls === 'own' ? '<span class="pill warn">ownership check</span>' : '<span class="pill ok">passes</span>'} ${esc(st.verdict)}</p>
    ${st.detail ? `<p class="mono">${esc(st.detail)}</p>` : ''}${st.open ? `<p class="quiet">See <b>${esc(st.open)}</b> in the Layers view.</p>` : ''}`;
  }
  reading.innerHTML = h;
  stSel.textContent = (meta.c && meta.c.id) || (meta.cls && (meta.cls.id + ' › ' + (meta.ep ? meta.ep.name : meta.m ? meta.m.name : meta.f.name))) || (meta.it && meta.it.name) || (meta.st && meta.st.title) || (meta.ep && meta.ep.name) || meta.title || (meta.cat && 'category') || '';
}

/* ---------- stage ---------- */
const VIEW_IDS = ['layers', 'features', 'annotations', 'roles', 'journey'];
const memo = (() => { try { return JSON.parse(localStorage.getItem('backend-explorer') || '{}'); } catch { return {}; } })();
const fromHash = () => { const p = new URLSearchParams(location.hash.slice(1)); return {view: p.get('view'), role: p.get('role'), sel: p.get('sel')}; };
const h0 = fromHash();
const startView = VIEW_IDS.includes(h0.view) ? h0.view : VIEW_IDS.includes(memo.view) ? memo.view : 'layers';
const startRole = ROLE_LABEL[h0.role] ? h0.role : ROLE_LABEL[memo.role] ? memo.role : 'student';

let ctxNow = {view: startView, settings: {role: startRole}};
let selNow = h0.sel || '', ready = false;
function remember(){
  const p = new URLSearchParams({view: ctxNow.view, role: ctxNow.settings.role});
  if (selNow) p.set('sel', selNow);
  try { localStorage.setItem('backend-explorer', JSON.stringify({view: ctxNow.view, role: ctxNow.settings.role})); } catch {}
  try { history.replaceState(null, '', '#' + p); } catch {}
}
function handlePick(node, why){
  content.querySelectorAll('.sel').forEach(n => n.classList.remove('sel'));
  if (node) node.classList.add('sel');
  if (why && why.depth && !why.back) return describe(null, ctxNow);
  const meta = node && node.orreryOwner && node.orreryOwner.meta;
  selNow = meta && meta.kind === 'class' ? meta.c.id
         : meta && meta.kind === 'ann' ? meta.it.name.split(/\s+[\/&]\s+/)[0].replace('@', '').trim() : '';
  remember();
  describe(meta, ctxNow);
}
const stage = createContextStage({
  svg, content, controls: document.querySelector('#contexts'),
  defaults: {role: 'student'},
  scenarios: Object.entries(ROLE_LABEL).map(([id, label]) => ({id, label, mode: 'replace', values: {role: id}})),
  views: [{id: 'layers', label: 'Layers'}, {id: 'features', label: 'Features'}, {id: 'annotations', label: 'Annotations'}, {id: 'roles', label: 'Roles'}, {id: 'journey', label: 'Request journey'}],
  initialScenario: startRole, initialView: startView,
  build: ({settings, view}) => view === 'layers' ? layersModel(settings.role) : view === 'features' ? featuresModel(settings.role) : view === 'roles' ? rolesModel()
                              : view === 'journey' ? journeyModel(settings.role) : annotationsModel(),
  onPick: handlePick,
  onChange: context => { ctxNow = context; if (ready) selNow = ''; remember(); describe(null, context); },
});

/* Select a class or annotation by name, wherever the camera is. */
function goTo(key){
  const id = ctxNow.view === 'annotations' ? ANN_ID[key] : ctxNow.view === 'layers' || ctxNow.view === 'features' ? key : null;
  if (!id) return false;
  if (stage.depth() > 1) stage.backTo(1);
  const n = [...stage.level().querySelectorAll('.orrery-object')].find(x => x.dataset.objectId === id);
  if (!n) return false;
  stage.markPick(n); handlePick(n, {index: true}); stage.frame(n);
  return true;
}

/* ---------- search ---------- */
const SEARCH = [];
for (const c of CLASSES) {
  const layer = LAYERS.find(l => l[0] === c.layer)[1];
  SEARCH.push({label: c.id, sub: layer + ' · ' + c.path.split('/').slice(-2).join('/'), view: 'layers', key: c.id});
  for (const e of c.endpoints || []) SEARCH.push({label: `${e.verb} ${e.path}`, sub: `${c.id}.${e.name}()`, view: 'layers', key: c.id});
  for (const m of c.methods || []) SEARCH.push({label: m.name + '()', sub: c.id, view: 'layers', key: c.id});
}
for (const a of Object.keys(ANN)) SEARCH.push({label: '@' + a, sub: 'annotation · ' + ANN[a].lib, view: 'annotations', key: a});
const qEl = document.getElementById('q'), hitsEl = document.getElementById('hits'), navEl = document.getElementById('nav');
const navBodyEl = navEl.querySelector('[data-nav-body]'), toggleEl = document.getElementById('list-toggle');
const narrow = () => matchMedia('(max-width:820px)').matches;
function setList(open){ navEl.classList.toggle('closed', !open); toggleEl.setAttribute('aria-expanded', String(open)); }
setList(!narrow());
toggleEl.addEventListener('click', () => { setList(toggleEl.getAttribute('aria-expanded') !== 'true'); if (ready) stage.fit(); });
function openHit(h){
  if (h.view !== ctxNow.view) stage.setViewMode(h.view);
  goTo(h.key);
  qEl.value = ''; runSearch(); if (narrow()) setList(false);
}
function runSearch(){
  const q = qEl.value.trim().toLowerCase();
  hitsEl.hidden = !q; navBodyEl.hidden = !!q;
  if (!q) return [];
  const rank = h => { const l = h.label.toLowerCase(); return l.startsWith(q) || l.startsWith('@' + q) ? 0 : l.includes(q) ? 1 : h.sub.toLowerCase().includes(q) ? 2 : 9; };
  const hits = SEARCH.map(h => [rank(h), h]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0]).slice(0, 14).map(x => x[1]);
  hitsEl.replaceChildren(...(hits.length ? hits.map(h => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn hit';
    b.innerHTML = `<b>${esc(h.label)}</b><span>${esc(h.sub)}</span>`;
    b.onclick = () => openHit(h); return b;
  }) : [Object.assign(document.createElement('div'), {className: 'none', textContent: 'Nothing matches.'})]));
  return hits;
}
qEl.addEventListener('input', runSearch);
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const h = runSearch()[0]; if (h) openHit(h); }
  else if (e.key === 'Escape' && qEl.value) { qEl.value = ''; runSearch(); e.stopPropagation(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.target.closest('input,textarea,select') || e.ctrlKey || e.metaKey) return;
  e.preventDefault(); setList(true); qEl.focus();
});

/* Editing the address by hand moves the explorer there. */
addEventListener('hashchange', () => {
  const h = fromHash();
  if (VIEW_IDS.includes(h.view) && h.view !== ctxNow.view) stage.setViewMode(h.view);
  if (ROLE_LABEL[h.role] && h.role !== ctxNow.settings.role) stage.setScenario(h.role);
  if (h.sel) goTo(h.sel);
});

stage.fit();
ready = true;
if (h0.sel) goTo(h0.sel); else remember();
</script>

<title>Backend explorer</title>
<meta name="description" content="Explore the Student Manager backend: layers, endpoints, roles and annotations.">
<style>
{{tokens}} {{fonts}} {{include:shell.css}}
.scene-nav{top:14px;left:14px;width:250px;max-height:calc(100% - 100px);display:flex;flex-direction:column}
.scene-nav .scroll{overflow:auto;padding:6px;min-height:0;flex:1}
.notes{top:14px;right:14px;width:360px;max-height:calc(100% - 96px);display:flex;flex-direction:column}
.notes .scroll{padding:14px 16px 16px;font-size:13.5px;line-height:1.55}
.notes h3{font:600 17px/1.3 var(--font-sans);margin:0 0 4px}
.notes h4{font:600 12px/1.3 var(--font-sans);margin:14px 0 6px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.notes{overflow-wrap:anywhere}
.notes p{margin:0 0 9px}
.notes .quiet{color:var(--text-muted)}
.notes code,.notes .mono{font-family:var(--font-mono);font-size:12px}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:0 0 5px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;margin-right:4px;
  background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.pill.ok{background:var(--md-sys-color-success-container);color:var(--md-sys-color-on-success-container)}
.pill.warn{background:var(--md-sys-color-warn-container);color:var(--md-sys-color-on-warn-container)}
.pill.no{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)}
.titlebar .list-toggle{margin-right:10px;padding:6px}
.search{padding:8px 8px 2px;flex-shrink:0}
.search input{width:100%;box-sizing:border-box;font:400 13.5px var(--font-sans);color:var(--text);
  background:var(--md-sys-color-surface-container-highest);border:1px solid var(--panel-line);
  border-radius:var(--shape-md);padding:7px 10px}
.search input:focus-visible{outline:2px solid var(--md-sys-color-primary);outline-offset:1px}
.hits .hit{display:block;width:100%;text-align:left;padding:6px 8px;margin:0 0 2px;border-radius:var(--shape-md)}
.hits .hit b{display:block;font:500 13px var(--font-mono);overflow-wrap:anywhere}
.hits .hit span{display:block;font-size:12px;color:var(--text-muted);overflow-wrap:anywhere}
.hits .none{padding:8px;color:var(--text-muted);font-size:13px}
.scene-nav.closed{display:none}
@media(max-width:820px){.scene-nav{top:10px;left:10px;right:10px;width:auto;max-height:70%;z-index:5}
  .notes{top:auto;left:10px;right:10px;bottom:66px;width:auto;max-height:44%}}
.card.l-web rect{stroke:var(--md-sys-color-primary)}
.lg-web{border-left:4px solid var(--md-sys-color-primary);padding-left:8px;margin:0 0 4px}
.card.l-service rect{stroke:var(--md-sys-color-tertiary)}
.lg-service{border-left:4px solid var(--md-sys-color-tertiary);padding-left:8px;margin:0 0 4px}
.card.l-data rect{stroke:var(--md-sys-color-secondary)}
.lg-data{border-left:4px solid var(--md-sys-color-secondary);padding-left:8px;margin:0 0 4px}
.card.l-domain rect{stroke:var(--md-sys-color-success)}
.lg-domain{border-left:4px solid var(--md-sys-color-success);padding-left:8px;margin:0 0 4px}
.card.l-request rect{stroke:var(--md-sys-color-warn)}
.lg-request{border-left:4px solid var(--md-sys-color-warn);padding-left:8px;margin:0 0 4px}
.card.l-cross rect{stroke:var(--md-sys-color-outline)}
.lg-cross{border-left:4px solid var(--md-sys-color-outline);padding-left:8px;margin:0 0 4px}
.card .rb{font:600 12px var(--font-sans)}
.card .rb.ok{fill:var(--md-sys-color-success)}
.card .rb.own{fill:var(--md-sys-color-warn)}
.card .rb.no{fill:var(--md-sys-color-error)}
.card .rb.k{fill:var(--text-muted);font-weight:400}
.card .flow{fill:none;stroke:var(--md-sys-color-outline);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card .t4{fill:var(--text-muted);font:400 12.5px var(--font-sans)}

.card rect{fill:var(--md-sys-color-surface-container-low);stroke:var(--md-sys-color-outline-variant);stroke-width:1.5;
  transition:stroke var(--dur-med) var(--ease-standard),fill var(--dur-med) var(--ease-standard)}
.card{cursor:pointer}
.card:hover rect{stroke:var(--md-sys-color-outline)}
.sel > .card rect{stroke:var(--md-sys-color-primary);stroke-width:2.6;
  fill:color-mix(in srgb,var(--md-sys-color-primary-container) 45%,var(--md-sys-color-surface))}
.card .t1{fill:var(--text);font:600 17px var(--font-sans)}
.card .t1m{fill:var(--text);font:500 14px var(--font-mono)}
.card .t2{fill:var(--text-muted);font:400 12.5px var(--font-mono)}
.card .t3{fill:var(--text-muted);font:400 13px var(--font-sans)}
.card.allow rect{stroke:var(--md-sys-color-success)}
.card.own rect{stroke:var(--md-sys-color-warn)}
.card.deny rect{stroke:var(--md-sys-color-error);stroke-dasharray:5 4}
.card.deny .t1m,.card.dim .t1{opacity:.5}
.card.dim{opacity:.6}
.card .badge{font:600 12px var(--font-sans)}
.card.allow .badge{fill:var(--md-sys-color-success)}
.card.own .badge{fill:var(--md-sys-color-warn)}
.card.deny .badge{fill:var(--md-sys-color-error)}
.scope rect{fill:none;stroke:var(--md-sys-color-outline);stroke-dasharray:6 5;stroke-width:1.5}
.scope text{fill:var(--text);font:600 19px var(--font-sans)}
.scope .sub{fill:var(--text-muted);font:400 13px var(--font-sans)}
.sel > .scope rect{stroke:var(--md-sys-color-primary);stroke-width:2.4}
</style>
<div class="titlebar"><button type="button" class="btn list-toggle" id="list-toggle" aria-expanded="true" aria-controls="nav" aria-label="Show or hide the list" title="Show or hide the list">{{icon:menu:20}}</button><h1>Student Manager · backend explorer</h1></div>

    <header><h2>Reading</h2></header>

  </section>
  <section class="hud tools">
    <button class="btn" id="zoom-out" aria-label="Zoom out">{{icon:zoom_out:18}}</button>
    <button class="btn" id="zoom-in" aria-label="Zoom in">{{icon:zoom_in:18}}</button>
    <button class="btn" id="fit">{{icon:crop_free:18}}Fit</button>
  </section>
</div>

/* ---------- who may call what: SecurityConfig, in order ---------- */
const RULES = [
  [null,'/error','permit'],
  ['GET','/api/auth/me','auth'],
  ['POST','/api/auth/login','permit'],
  ['POST','/api/auth/register','ADMIN'],
  [null,'/swagger-ui.html|/swagger-ui/**|/v3/api-docs/**','auth'],
  [null,'/actuator/health/**','permit'],
  ['GET','/api/terms/**','auth'], [null,'/api/terms/**','ADMIN'],
  ['GET','/api/courses/options','TEACHER,ADMIN'], ['GET','/api/courses/**','auth'], [null,'/api/courses/**','TEACHER,ADMIN'],
  ['GET','/api/students/me','auth'], ['GET','/api/enrollments/student/**','auth'],
  ['GET','/api/students/**','TEACHER,ADMIN'], [null,'/api/students/**','ADMIN'],
  ['GET','/api/teachers/**','TEACHER,ADMIN'], [null,'/api/teachers/**','ADMIN'],
  ['POST','/api/enrollments','STUDENT,TEACHER,ADMIN'],
  ['PATCH','/api/enrollments/*/cancel','STUDENT,TEACHER,ADMIN'],
  ['PATCH','/api/enrollments/*/grade-seen','STUDENT'],
  ['DELETE','/api/enrollments/**','ADMIN'],
  [null,'/api/enrollments/**','TEACHER,ADMIN'],
  [null,'**','auth'],
];
function patternRegex(p){
  return new RegExp('^(?:' + p.split('|').map(x => {
    if (x === '**') return '.*';
    const tail = x.endsWith('/**');
    if (tail) x = x.slice(0, -3);
    return x.split('*').map(s => s.replace(/[.+?^$()\[\]\\]/g, '\\$&')).join('[^/]+') + (tail ? '(?:/.*)?' : '');
  }).join('|') + ')$');
}
const COMPILED = RULES.map(([m, p, a]) => ({m, p, a, re: patternRegex(p)}));
const ROLE_LABEL = {anonymous:'Anonymous', student:'Student', teacher:'Teacher', admin:'Admin'};
function access(role, ep){
  const path = ep.path.replace(/\{[^}]+\}/g, 'x1');
  const rule = COMPILED.find(r => (!r.m || r.m === ep.verb) && r.re.test(path));
  const who = rule.a === 'permit' ? 'everyone, signed in or not'
            : rule.a === 'auth' ? 'any signed-in user' : rule.a.split(',').map(s => s[0] + s.slice(1).toLowerCase()).join(' or ');
  const R = role.toUpperCase();
  const ok = rule.a === 'permit' || (rule.a === 'auth' ? role !== 'anonymous' : rule.a.split(',').includes(R));
  const guard = (ep.pre.match(/@ownershipGuard\.(\w+)/) || [])[1] || '';
  return {ok, rule: `${rule.m || 'any'} ${rule.p.replace(/\|/g,' , ')}`, who, guard,
          status: ok ? 200 : role === 'anonymous' ? 401 : 403};
}

/* ---------- drawing helpers ---------- */
const clip = (s, px, size, mono) => { const n = Math.max(4, Math.floor(px / (size * (mono ? 0.6 : 0.56)))); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function el(name, attrs, text){ const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
function card(x, y, w, h, lines, cls = ''){
  return (g, item) => {
    g.setAttribute('class', 'card ' + cls);
    g.append(el('rect', {x, y, width: w, height: h, rx: 12, 'data-face': ''}));
    let ty = y + 29;
    for (const [k, t, size, mono] of lines) {
      g.append(el('text', {x: x + 16, y: ty, class: k}, clip(t, w - 32, size, mono)));
      ty += k === 't1' || k === 't1m' ? 23 : 20;
    }
  };
}
function scope(x, y, w, h, title, sub){
  return g => {
    g.setAttribute('class', 'scope');
    g.append(el('rect', {x, y, width: w, height: h, rx: 16, 'data-face': ''}),
             el('text', {x: x + 24, y: y + 33}, title), el('text', {x: x + 24, y: y + 54, class: 'sub'}, sub));
  };
}
const grid = (i, cols, w, h, gap, x0, y0) => [x0 + (i % cols) * (w + gap), y0 + Math.floor(i / cols) * (h + gap)];

/* ---------- layer metadata ---------- */
const LAYERS = [

];
const byLayer = l => CLASSES.filter(c => c.layer === l);

/* ---------- interiors ---------- */
function interiorOf(c, role){
  const W = 340, H = 104, GAP = 22, COLS = 3, X0 = 40, Y0 = 60;
  let items = [];
  if (c.layer === 'web') {
    items = c.endpoints.map((ep, i) => {
      const a = access(role, ep), own = a.ok && a.guard;
      const [x, y] = grid(i, COLS, W, H, GAP, X0, Y0);
      const badge = a.ok ? (own ? `ALLOWED · then ownership check` : 'ALLOWED') : `BLOCKED · ${a.status}`;
      return {id: 'ep' + i, label: `${ep.verb} ${ep.path}`, meta: {kind: 'endpoint', ep, a, cls: c},
        draw: (g, it) => { card(x, y, W, H, [['t1m', `${ep.verb} ${ep.path}`, 14, true], ['t2', `${ep.name}()`, 12.5, true], ['badge', badge, 12]],
          a.ok ? (own ? 'own' : 'allow') : 'deny')(g, it); const t = g.querySelector('.badge'); t.setAttribute('class', 'badge'); }};
    });
  } else if (c.layer === 'service' || c.layer === 'data' || c.layer === 'cross') {
    const readOnly = c.ann.some(([a, g]) => a === 'Transactional' && /readOnly\s*=\s*true/.test(g));
    items = c.methods.map((m, i) => {
      const [x, y] = grid(i, COLS, W, H, GAP, X0, Y0);
      const tx = m.ann.find(([a]) => a === 'Transactional');
      const note = c.layer === 'service' ? (tx ? 'write transaction' : readOnly ? 'read-only transaction' : '') :
                   m.ann.filter(([a]) => a !== 'Override').map(([a]) => '@' + a).join(' ');
      return {id: 'm' + i, label: m.name, meta: {kind: 'method', m, cls: c, tx: !!tx, readOnly},
        draw: card(x, y, W, H, [['t1m', m.name + '()', 14, true], ['t2', '→ ' + m.ret, 12.5, true], ['t3', note, 13]])};
    });
  } else {
    items = c.fields.map((f, i) => {
      const [x, y] = grid(i, COLS, W, H, GAP, X0, Y0);
      const tags = f.ann.map(([a]) => '@' + a).join(' ');
      return {id: 'f' + i, label: f.name, meta: {kind: 'field', f, cls: c},
        draw: card(x, y, W, H, [['t1m', f.name, 14, true], ['t2', f.type, 12.5, true], ['t3', tags, 13]])};
    });
  }
  return items.length ? {id: 'in-' + c.id, label: c.id, items} : null;
}

function classCard(c, role, x, y, w, h){
  const anns = decoAnns(c).slice(0, 3).map(([a]) => '@' + a).join(' ');
  let third = '', cls = '';
  if (c.layer === 'web') {
    const open = c.endpoints.filter(e => access(role, e).ok).length;
    third = `${open} of ${c.endpoints.length} endpoints open to ${ROLE_LABEL[role]}`;
    if (!open) cls = 'dim';
  } else if (c.layer === 'service' || c.layer === 'data' || c.layer === 'cross') third = c.methods.length ? `${c.methods.length} methods` : (c.kind === 'interface' ? 'interface' : '');
  else third = `${c.fields.length} fields`;
  return card(x, y, w, h, [['t1', c.id, 17], ['t2', anns, 12.5, true], ['t3', third, 13]], cls);
}

        const [x, y] = grid(i, b.cols, W, H, GAP, x0 + PAD, y0 + HEAD);
        const open = c.layer === 'web' ? c.endpoints.filter(e => access(role, e).ok).length : 0;
        const third = c.layer === 'web' ? `controller · ${open}/${c.endpoints.length} endpoints open` : LAYER_SHORT[c.layer] + (c.kind === 'interface' ? ' · interface' : '');
        return {id: c.id, label: c.id, meta: {kind: 'class', c}, interior: interiorOf(c, role),
          draw: card(x, y, W, H, [['t1', c.id, 16], ['t3', third, 13]], 'l-' + c.layer + (c.layer === 'web' && !open ? ' dim' : ''))};
      })});
  }
  return {id: 'features', label: 'Features', items};
}

const LANES = [
  ['seen',   'A student confirms they have seen a grade', 'EnrollmentController', 'markGradeSeen'],
  ['enroll', 'Someone enrolls a student in a course',     'EnrollmentController', 'create'],
  ['grade',  'A teacher enters a grade',                  'EnrollmentController', 'updateGrade'],
];
function laneSteps(role, ctlId, epName){
  const ctl = CLASSES.find(c => c.id === ctlId), ep = ctl.endpoints.find(e => e.name === epName), a = access(role, ep);
  const svc = CLASSES.find(c => c.layer === 'service' && (ctl.deps.includes(c.id) || ctl.deps.includes(c.implements)));
  const m = svc && svc.methods.find(x => x.name === epName);
  const repo = svc && CLASSES.find(c => c.layer === 'data' && svc.deps.includes(c.id) && svc.id.startsWith(c.id.replace(/Repository$/, '')));
  const ent = repo && CLASSES.find(c => c.layer === 'domain' && c.id === (repo.extends.match(/<(\w+)>/) || [])[1]);
  const tx = m && m.ann.some(([n]) => n === 'Transactional');
  const ro = svc && svc.ann.some(([n, g]) => n === 'Transactional' && /readOnly\s*=\s*true/.test(g));
  const stopped = !a.ok, own = a.ok && a.guard;
  const why = {
    url: 'The first gate. SecurityConfig lists URL rules in order and the first rule that matches decides who may pass.',
    method: '@PreAuthorize runs just before the controller method. OwnershipGuard then checks that this particular record belongs to the caller: a student\'s own data, a teacher\'s own course.',
    service: 'The service holds the business rules and opens the transaction. Nothing below it knows who the caller is.',
    repo: 'The repository talks to the database through Spring Data JPA.',
    entity: 'The entity is the row that is read or changed. BaseEntity adds id, audit fields and a version.',
  };
  return [
    {key: 'url', n: 1, title: 'URL rule', detail: `${a.rule}`, verdict: stopped ? `stops here · HTTP ${a.status}` : `passes (${a.who})`, cls: stopped ? 'deny' : 'allow', open: 'SecurityConfig', why: why.url, a},
    {key: 'method', n: 2, title: `${ctl.id}.${ep.name}()`, detail: ep.pre || 'no @PreAuthorize on this method', verdict: stopped ? 'not reached' : own ? `ownership check: ${a.guard}` : 'passes', cls: stopped ? 'dim' : own ? 'own' : 'allow', open: ctl.id, why: why.method, a},
    {key: 'service', n: 3, title: svc ? svc.id : '—', detail: m ? `${m.name}()` : '', verdict: stopped ? 'not reached' : tx ? 'write transaction' : ro ? 'read-only transaction' : 'runs', cls: stopped ? 'dim' : '', open: svc && svc.id, why: why.service, a},
    {key: 'repo', n: 4, title: repo ? repo.id : '—', detail: 'Spring Data JPA', verdict: stopped ? 'not reached' : repo ? `${repo.methods.length} queries` : '', cls: stopped ? 'dim' : '', open: repo && repo.id, why: why.repo, a},
    {key: 'entity', n: 5, title: ent ? ent.id : '—', detail: 'JPA entity', verdict: stopped ? 'not reached' : ent ? `${ent.fields.length} fields` : '', cls: stopped ? 'dim' : '', open: ent && ent.id, why: why.entity, a},
  ];
}
function journeyModel(role){
  const W = 280, H = 126, GAP = 40, PAD = 24, HEAD = 74;
  const full = 5 * W + 4 * GAP + 2 * PAD;
  let y = 0; const items = [];
  for (const [id, title, ctl, epName] of LANES) {
    const steps = laneSteps(role, ctl, epName), ep = CLASSES.find(c => c.id === ctl).endpoints.find(e => e.name === epName);
    const h = HEAD + H + PAD;
    items.push({id: 'jl-' + id, label: title, meta: {kind: 'layer', id, title, sub: `${ep.verb} ${ep.path}`, n: 5, unit: 'steps'},
      draw: scope(0, y, full, h, title, `${ep.verb} ${ep.path} as ${ROLE_LABEL[role]}`),
      children: steps.map((st, i) => {
        const x = PAD + i * (W + GAP), yy = y + HEAD;
        return {id: `js-${id}-${st.key}`, label: `${st.n} · ${st.title}`, meta: {kind: 'step', st, ep, role},
          draw: (g, it) => {
            card(x, yy, W, H, [['t1m', `${st.n} · ${st.title}`, 14, true], ['t2', st.detail, 12.5, true], ['t3', st.verdict, 13]], st.cls)(g, it);
            if (i < 4) g.append(el('path', {class: 'flow', d: `M${x + W + 6},${yy + H / 2}h${GAP - 12}m-6,-5l6,5l-6,5`}));
          }};
      })});
    y += h + 44;
  }
  return {id: 'journey', label: 'Request journey', items};
}

/* ---------- reading panel ---------- */
const annBlock = anns => {
  const rows = anns.filter(([a]) => ANN[a]).map(([a, args]) =>
    `<li><code>@${esc(a)}</code>${args ? ` <span class="quiet mono">(${esc(args.length > 90 ? args.slice(0, 89) + '…' : args)})</span>` : ''}<br>
     <span class="quiet">${esc(plain(ANN[a].desc))}</span></li>`);
  return rows.length ? `<h4>Annotations</h4><ul>${rows.join('')}</ul>` : '';
};
function intro(ctx){
  const v = ctx.view, role = ROLE_LABEL[ctx.settings.role];
  const T = {
    layers: ['The backend, layer by layer', `${CLASSES.length} classes in six layers. Select one to read it; double-click or press Enter on a controller, service, repository, entity or request to open its endpoints, methods or fields.`],
    features: ['The backend, area by area', 'The same classes, grouped by what they are for instead of which layer they sit in. Lines run from the centre to each area; the border colour of a card is its layer. Select a class to read it, double-click a controller, service or entity to look inside.'],
    annotations: ['Every annotation in the backend', 'Each card is one annotation. Select it to see what it does and which classes use it.'],
    roles: ['Who may call what', 'One card per endpoint, one column per role. Select an endpoint to see which rule decides it for each role.'],
    journey: ['A request, followed through', `Three requests, each traced through URL rule, method rule, service, repository and entity as ${role}. Switch the Scenario to see where each role is stopped.`],
  }[v];
  reading.innerHTML = `<h3>${T[0]}</h3><p class="quiet">${T[1]}</p>` + (v === 'layers' ? `<h4>Role</h4><p>Pick a Scenario above (<b>${role}</b> now). Controller cards show how many endpoints that role can reach; inside a controller, every endpoint is
  <span class="pill ok">allowed</span> <span class="pill warn">allowed + ownership check</span> or <span class="pill no">blocked</span> according to <code>SecurityConfig</code>.</p>`
  : v === 'features' ? `<h4>Layer colours</h4>` + Object.entries(LAYER_SHORT).map(([k, t]) => `<p class="lg-${k}">${t}</p>`).join('')
  : v === 'roles' ? `<h4>Legend</h4><p><span class="pill ok">✓ allowed</span> <span class="pill warn">✓ + check</span> allowed once <code>OwnershipGuard</code> confirms the record is the caller's; <span class="pill no">✕ blocked</span> with HTTP 401 (anonymous) or 403.</p>` : '');
  stSel.textContent = 'nothing selected';
}
function describe(meta, ctx){
  const role = ctx.settings.role;
  if (!meta) return intro(ctx);
  let h = '';
  if (meta.kind === 'layer') h = `<h3>${esc(meta.title)}</h3><p>${esc(meta.sub)}</p><p class="quiet">${meta.n} ${meta.unit || 'classes'}.</p>`;
  else if (meta.kind === 'class') {
    const c = meta.c;
    h = `<h3>${esc(c.id)}</h3><p><span class="pill">${esc(c.kind)}</span><span class="pill">${esc(LAYERS.find(l => l[0] === c.layer)[1])}</span></p>
    <p class="quiet mono">${esc(c.path)}</p>${c.doc ? `<p>${esc(c.doc)}</p>` : ''}`;
    if (c.extends || c.implements) h += `<p class="mono">${c.extends ? 'extends ' + esc(c.extends) : ''}${c.extends && c.implements ? '<br>' : ''}${c.implements ? 'implements ' + esc(c.implements) : ''}</p>`;
    if (c.deps.length) h += `<h4>Depends on</h4><p class="mono">${c.deps.map(esc).join('<br>')}</p>`;
    if (c.layer === 'web') {
      const rows = c.endpoints.map(e => ({e, a: access(role, e)}));
      h += `<h4>${esc(ROLE_LABEL[role])} access</h4><p>${rows.filter(r => r.a.ok).length} of ${rows.length} endpoints open.</p>`;
    }
    h += annBlock(c.ann);
  } else if (meta.kind === 'endpoint') {
    const {ep, a, cls} = meta;
    h = `<h3 class="mono">${esc(ep.verb)} ${esc(ep.path)}</h3><p><span class="pill">${esc(cls.id)}.${esc(ep.name)}()</span></p>
    ${ep.doc ? `<p>${esc(ep.doc)}</p>` : ''}
    <h4>${esc(ROLE_LABEL[role])}</h4>
    <p>${a.ok ? `<span class="pill ok">allowed</span>` : `<span class="pill no">blocked · HTTP ${a.status}</span>`}
       ${a.ok && a.guard ? `<span class="pill warn">then ownership check</span>` : ''}</p>
    <p class="quiet">URL rule in <code>SecurityConfig</code>: <code>${esc(a.rule)}</code> allows ${esc(a.who)}.</p>
    ${ep.pre ? `<p class="quiet">Method rule <code>@PreAuthorize</code>: <code>${esc(ep.pre)}</code>${a.guard ? ` — ${esc(a.guard)} in OwnershipGuard decides whether this particular record belongs to the caller.` : ''}</p>` : ''}
    <h4>Signature</h4><p class="mono">${esc(ep.ret)} ${esc(ep.name)}(${esc(ep.params)})</p>`;
  } else if (meta.kind === 'method') {
    const {m, cls} = meta;
    h = `<h3 class="mono">${esc(m.name)}()</h3><p><span class="pill">${esc(cls.id)}</span>${meta.tx ? '<span class="pill warn">write transaction</span>' : meta.readOnly ? '<span class="pill ok">read-only transaction</span>' : ''}</p>
    ${m.doc ? `<p>${esc(m.doc)}</p>` : ''}<h4>Signature</h4><p class="mono">${esc(m.ret)} ${esc(m.name)}(${esc(m.params)})</p>${annBlock(m.ann)}`;
  } else if (meta.kind === 'field') {
    const {f, cls} = meta;
    h = `<h3 class="mono">${esc(f.name)}</h3><p><span class="pill">${esc(cls.id)}</span><span class="pill">${esc(f.type)}</span></p>${annBlock(f.ann)}`;
    if (!f.ann.length) h += '<p class="quiet">No annotations on this field.</p>';
  } else if (meta.kind === 'cat') h = `<h3>${meta.cat.title}</h3><p class="quiet">${meta.cat.lead}</p><p>${meta.cat.items.length} annotations.</p>`;
  else if (meta.kind === 'ann') h = `<h3 class="mono">${esc(meta.it.name)}</h3><p><span class="pill">${esc(meta.it.lib)}</span></p><p>${meta.it.desc}</p><h4>Used in</h4><p>${esc(meta.it.where)}</p>`;
  else if (meta.kind === 'rolerow') {
    const {ep, cls, all} = meta;
    h = `<h3 class="mono">${esc(ep.verb)} ${esc(ep.path)}</h3><p><span class="pill">${esc(cls.id)}.${esc(ep.name)}()</span></p>${ep.doc ? `<p>${esc(ep.doc)}</p>` : ''}<h4>By role</h4><ul>` +
      all.map(([r, a]) => `<li><b>${ROLE_LABEL[r]}</b> ${a.ok ? `<span class="pill ok">allowed</span>${a.guard ? ' <span class="pill warn">then ownership check</span>' : ''}` : `<span class="pill no">blocked · HTTP ${a.status}</span>`}</li>`).join('') +
      `</ul><p class="quiet">URL rule in <code>SecurityConfig</code>: <code>${esc(all[1][1].rule)}</code> allows ${esc(all[1][1].who)}.</p>${ep.pre ? `<p class="quiet">Method rule: <code>${esc(ep.pre)}</code></p>` : ''}`;
  } else if (meta.kind === 'step') {
    const {st, ep, role: r} = meta;
    h = `<h3 class="mono">${st.n} · ${esc(st.title)}</h3><p><span class="pill">${esc(ep.verb)} ${esc(ep.path)}</span></p><p>${esc(st.why)}</p>
    <h4>${esc(ROLE_LABEL[r])}</h4><p>${st.cls === 'deny' ? '<span class="pill no">stopped here</span>' : st.cls === 'dim' ? '<span class="pill">never reached</span>' : st.cls === 'own' ? '<span class="pill warn">ownership check</span>' : '<span class="pill ok">passes</span>'} ${esc(st.verdict)}</p>
    ${st.detail ? `<p class="mono">${esc(st.detail)}</p>` : ''}${st.open ? `<p class="quiet">See <b>${esc(st.open)}</b> in the Layers view.</p>` : ''}`;
  }
  reading.innerHTML = h;
  stSel.textContent = (meta.c && meta.c.id) || (meta.cls && (meta.cls.id + ' › ' + (meta.ep ? meta.ep.name : meta.m ? meta.m.name : meta.f.name))) || (meta.it && meta.it.name) || (meta.st && meta.st.title) || (meta.ep && meta.ep.name) || meta.title || (meta.cat && 'category') || '';
}

/* ---------- stage ---------- */
const VIEW_IDS = ['layers', 'features', 'annotations', 'roles', 'journey'];
const memo = (() => { try { return JSON.parse(localStorage.getItem('backend-explorer') || '{}'); } catch { return {}; } })();
const fromHash = () => { const p = new URLSearchParams(location.hash.slice(1)); return {view: p.get('view'), role: p.get('role'), sel: p.get('sel')}; };
const h0 = fromHash();
const startView = VIEW_IDS.includes(h0.view) ? h0.view : VIEW_IDS.includes(memo.view) ? memo.view : 'layers';
const startRole = ROLE_LABEL[h0.role] ? h0.role : ROLE_LABEL[memo.role] ? memo.role : 'student';

let ctxNow = {view: startView, settings: {role: startRole}};
let selNow = h0.sel || '', ready = false;
function remember(){
  const p = new URLSearchParams({view: ctxNow.view, role: ctxNow.settings.role});
  if (selNow) p.set('sel', selNow);
  try { localStorage.setItem('backend-explorer', JSON.stringify({view: ctxNow.view, role: ctxNow.settings.role})); } catch {}
  try { history.replaceState(null, '', '#' + p); } catch {}
}
function handlePick(node, why){
  content.querySelectorAll('.sel').forEach(n => n.classList.remove('sel'));
  if (node) node.classList.add('sel');
  if (why && why.depth && !why.back) return describe(null, ctxNow);
  const meta = node && node.orreryOwner && node.orreryOwner.meta;
  selNow = meta && meta.kind === 'class' ? meta.c.id
         : meta && meta.kind === 'ann' ? meta.it.name.split(/\s+[\/&]\s+/)[0].replace('@', '').trim() : '';
  remember();
  describe(meta, ctxNow);
}
const stage = createContextStage({
  svg, content, controls: document.querySelector('#contexts'),
  defaults: {role: 'student'},
  scenarios: Object.entries(ROLE_LABEL).map(([id, label]) => ({id, label, mode: 'replace', values: {role: id}})),
  views: [{id: 'layers', label: 'Layers'}, {id: 'features', label: 'Features'}, {id: 'annotations', label: 'Annotations'}, {id: 'roles', label: 'Roles'}, {id: 'journey', label: 'Request journey'}],
  initialScenario: startRole, initialView: startView,
  build: ({settings, view}) => view === 'layers' ? layersModel(settings.role) : view === 'features' ? featuresModel(settings.role) : view === 'roles' ? rolesModel()
                              : view === 'journey' ? journeyModel(settings.role) : annotationsModel(),
  onPick: handlePick,
  onChange: context => { ctxNow = context; if (ready) selNow = ''; remember(); describe(null, context); },
});

/* Select a class or annotation by name, wherever the camera is. */
function goTo(key){
  const id = ctxNow.view === 'annotations' ? ANN_ID[key] : ctxNow.view === 'layers' || ctxNow.view === 'features' ? key : null;
  if (!id) return false;
  if (stage.depth() > 1) stage.backTo(1);
  const n = [...stage.level().querySelectorAll('.orrery-object')].find(x => x.dataset.objectId === id);
  if (!n) return false;
  stage.markPick(n); handlePick(n, {index: true}); stage.frame(n);
  return true;
}

/* ---------- search ---------- */
const SEARCH = [];
for (const c of CLASSES) {
  const layer = LAYERS.find(l => l[0] === c.layer)[1];
  SEARCH.push({label: c.id, sub: layer + ' · ' + c.path.split('/').slice(-2).join('/'), view: 'layers', key: c.id});
  for (const e of c.endpoints || []) SEARCH.push({label: `${e.verb} ${e.path}`, sub: `${c.id}.${e.name}()`, view: 'layers', key: c.id});
  for (const m of c.methods || []) SEARCH.push({label: m.name + '()', sub: c.id, view: 'layers', key: c.id});
}
for (const a of Object.keys(ANN)) SEARCH.push({label: '@' + a, sub: 'annotation · ' + ANN[a].lib, view: 'annotations', key: a});
const qEl = document.getElementById('q'), hitsEl = document.getElementById('hits'), navEl = document.getElementById('nav');
const navBodyEl = navEl.querySelector('[data-nav-body]'), toggleEl = document.getElementById('list-toggle');
const narrow = () => matchMedia('(max-width:820px)').matches;
function setList(open){ navEl.classList.toggle('closed', !open); toggleEl.setAttribute('aria-expanded', String(open)); }
setList(!narrow());
toggleEl.addEventListener('click', () => { setList(toggleEl.getAttribute('aria-expanded') !== 'true'); if (ready) stage.fit(); });
function openHit(h){
  if (h.view !== ctxNow.view) stage.setViewMode(h.view);
  goTo(h.key);
  qEl.value = ''; runSearch(); if (narrow()) setList(false);
}
function runSearch(){
  const q = qEl.value.trim().toLowerCase();
  hitsEl.hidden = !q; navBodyEl.hidden = !!q;
  if (!q) return [];
  const rank = h => { const l = h.label.toLowerCase(); return l.startsWith(q) || l.startsWith('@' + q) ? 0 : l.includes(q) ? 1 : h.sub.toLowerCase().includes(q) ? 2 : 9; };
  const hits = SEARCH.map(h => [rank(h), h]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0]).slice(0, 14).map(x => x[1]);
  hitsEl.replaceChildren(...(hits.length ? hits.map(h => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn hit';
    b.innerHTML = `<b>${esc(h.label)}</b><span>${esc(h.sub)}</span>`;
    b.onclick = () => openHit(h); return b;
  }) : [Object.assign(document.createElement('div'), {className: 'none', textContent: 'Nothing matches.'})]));
  return hits;
}
qEl.addEventListener('input', runSearch);
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const h = runSearch()[0]; if (h) openHit(h); }
  else if (e.key === 'Escape' && qEl.value) { qEl.value = ''; runSearch(); e.stopPropagation(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.target.closest('input,textarea,select') || e.ctrlKey || e.metaKey) return;
  e.preventDefault(); setList(true); qEl.focus();
});

/* Editing the address by hand moves the explorer there. */
addEventListener('hashchange', () => {
  const h = fromHash();
  if (VIEW_IDS.includes(h.view) && h.view !== ctxNow.view) stage.setViewMode(h.view);
  if (ROLE_LABEL[h.role] && h.role !== ctxNow.settings.role) stage.setScenario(h.role);
  if (h.sel) goTo(h.sel);
});

stage.fit();
ready = true;
if (h0.sel) goTo(h0.sel); else remember();
</script>

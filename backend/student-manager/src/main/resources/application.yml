spring:
  application:
    name: student-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/studentmanager
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  docker:
    compose:
      file: backend/student-manager/compose.yaml
      enabled: false

server:
  port: 5030

management:
  endpoints:
    web:
      exposure:
        include: health   # only /actuator/health is exposed (the path is permitAll)
  endpoint:
    health:
      probes:
        enabled: true     # adds /actuator/health/liveness and /readiness for container platforms
      show-details: never

logging:
  level:
    root: INFO
    com.studentmanager: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/student-manager.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
jwt:
  secret: student-manager-secret-key-2024-very-long-secure-string-minimum-32-chars
  expiration: 86400000
spring:
  application:
    name: student-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentmanager}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    # TODO(SEC-4) [HIGH]: drop this default password — a deployment that forgets to override
    # SPRING_DATASOURCE_PASSWORD silently runs with a well-known credential.
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver  
  jpa:
    hibernate:
      # The schema is owned by Flyway (db/migration); Hibernate only checks that the
      # entities still match it. Override with SPRING_JPA_DDL_AUTO=update for throwaway local DBs.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${SPRING_JPA_SHOW_SQL:false}
  flyway:
    # Databases created before Flyway (Render, existing local ones) already contain the V1
    # schema: mark it as applied instead of re-running it, then apply V2 onwards.
    baseline-on-migrate: true
    baseline-version: 1
  docker:
    compose:
      file: backend/student-manager/compose.yaml
      enabled: false
  data:
    web:
      pageable:
        # List endpoints are paged: ?page=0&size=10&sort=lastName,asc
        default-page-size: 10
        # Caps ?size= so a client can't ask for the whole table in one request.
        max-page-size: 100
        # Page<T> results are serialized via Spring Data's stable PagedModel DTO:
        # {"content": [...], "page": {"size", "number", "totalElements", "totalPages"}}
        serialization-mode: via-dto
  session:
    jdbc:
      # Spring Boot only auto-creates the SPRING_SESSION tables for embedded databases;
      # `always` creates them in Postgres too (idempotent — skipped if they exist).
      initialize-schema: always

app:
  accounts:
    # Initial password for accounts an ADMIN creates without typing one (e.g. together
    # with a new student/teacher). Users can change it on their profile page, but are
    # not forced to: override it in any environment that is not a throwaway demo.
    default-password: ${DEFAULT_ACCOUNT_PASSWORD:testuser12}
  seed:
    # Fill an empty database with sample data (admin account + 10 terms/teachers/students/
    # courses/enrollments, see DemoDataSeeder). Off by default so production never gets
    # well-known demo accounts; docker-compose switches it on.
    demo-data: ${SEED_DEMO_DATA:false}

server:
  # Fixed on purpose: the host is pointed at 5030 (Render: PORT=5030 in the
  # service's environment) rather than the app following a platform-assigned $PORT.
  port: 5030
  # Honour X-Forwarded-* from the Render/Vercel edge so HTTPS/host are correct.
  forward-headers-strategy: framework
  servlet:
    session:
      # Idle timeout of the server-side session (replaces the old 1h JWT lifetime).
      timeout: ${SESSION_TIMEOUT:1h}
      cookie:
        # SESSION cookie: never readable from JS, sent only to this origin. The frontend
        # reaches the API same-origin (Vite/nginx/Vercel proxy /api), so Lax is enough.
        http-only: true
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true in production (HTTPS); false for http://localhost.
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health   # only /actuator/health is exposed (the path is permitAll)
  endpoint:
    health:
      probes:
        enabled: true     # adds /actuator/health/liveness and /readiness for container platforms
      show-details: never

logging:
  level:
    root: INFO
    com.student_manager: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

spring:
  application:
    name: student-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentmanager}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    # TODO(SEC-4) [HIGH]: drop this default password — a deployment that forgets to override
    # SPRING_DATASOURCE_PASSWORD silently runs with a well-known credential.
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver  
  jpa:
    hibernate:
      # `update` keeps the schema in sync without migrations for local/dev use.
      # Set SPRING_JPA_DDL_AUTO=validate once a migration tool is in place.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${SPRING_JPA_SHOW_SQL:false}
  docker:
    compose:
      file: backend/student-manager/compose.yaml
      enabled: false

server:
  port: 5030
  # Honour X-Forwarded-* from the Railway/Vercel edge so HTTPS/host are correct.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health   # only /actuator/health is exposed (the path is permitAll)
  endpoint:
    health:
      probes:
        enabled: true     # adds /actuator/health/liveness and /readiness for container platforms
      show-details: never

logging:
  level:
    root: INFO
    com.student_manager: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# TODO(SEC-1) [CRITICAL]: remove this hardcoded default signing secret — it's committed to the
# repo, so anyone who reads it (or any deployment that forgets to set JWT_SECRET) can forge
# valid tokens for any user/role. Fail startup instead if JWT_SECRET is unset.
jwt:
  secret: ${JWT_SECRET:student-manager-secret-key-2024-very-long-secure-string-minimum-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}

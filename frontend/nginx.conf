server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The app has no external CDN scripts/styles/fonts — everything is bundled by Vite and
    # served from this origin — so a strict self-only CSP works. connect-src additionally
    # allows the production API origin (VITE_API_URL, baked in at build time); update this if
    # that origin ever changes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://backend-production-8ceca.up.railway.app; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

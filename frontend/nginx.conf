server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The app has no external CDN scripts/styles/fonts — everything is bundled by Vite and
    # served from this origin — and the API is proxied under /api below, so a strict
    # self-only CSP (including connect-src) works.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    # Same-origin API: keeps the backend's HttpOnly SESSION cookie first-party.
    # "backend" is the docker-compose service name.
    location /api/ {
        proxy_pass http://backend:5030;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

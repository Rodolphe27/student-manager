server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # TODO(FE-4) [HIGH]: no security headers at all on this production serving layer — add
    # Content-Security-Policy, X-Content-Type-Options: nosniff, X-Frame-Options/frame-ancestors,
    # Referrer-Policy, and Strict-Transport-Security (if TLS terminates here or is enforced upstream).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

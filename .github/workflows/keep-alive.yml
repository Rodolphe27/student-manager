name: Keep backend awake

# The backend runs on Render's free plan, which puts the service to sleep after
# 15 minutes without traffic; the next visitor then waits ~1-2 min for Spring
# Boot to start (and the request may time out through the Vercel /api proxy).
# Pinging the health endpoint every 10 minutes keeps it warm. One always-on free
# service fits within Render's 750 free instance-hours per month.
#
# Note: GitHub pauses scheduled workflows in repositories with no activity for
# 60 days; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /actuator/health
        run: |
          # Generous timeout + retries: if the instance did fall asleep, this
          # request is the one that wakes it.
          curl --fail --silent --show-error --max-time 150 --retry 2 --retry-delay 10 \
            https://student-manager-backend-ijo8.onrender.com/actuator/health

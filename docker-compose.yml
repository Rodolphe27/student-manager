services:
  postgres:
    image: postgres:16
    container_name: sm_postgres
    environment:
      POSTGRES_DB: studentmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend/student-manager
    ports:
      - "5030:5030"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studentmanager
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Local demo only: fills the empty database with an admin account and 10 terms, teachers,
      # students, courses and enrollments (password: DEFAULT_ACCOUNT_PASSWORD, see README).
      SEED_DEMO_DATA: "true"
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
